<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily IAS Prep</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background-color: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 600px; width: 100%; }
        h1 { text-align: center; color: #333; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 25px; font-size: 0.9em; }
        .question-box { font-size: 1.1em; margin-bottom: 20px; font-weight: 600; color: #2c3e50; line-height: 1.5; white-space: pre-line; }
        .options-list { list-style-type: none; padding: 0; }
        .option-btn { display: block; width: 100%; padding: 12px; margin-bottom: 10px; background-color: #e9ecef; border: 1px solid #ddd; border-radius: 5px; text-align: left; cursor: pointer; font-size: 0.95em; transition: background 0.2s; line-height: 1.4; }
        .option-btn:hover { background-color: #dbe2e8; }
        .correct { background-color: #d4edda !important; border-color: #c3e6cb !important; color: #155724; }
        .wrong { background-color: #f8d7da !important; border-color: #f5c6cb !important; color: #721c24; }
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 20px; border-top: 1px solid #eee; padding-top: 20px; }
        .btn { padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 1em; }
        .btn:disabled { background-color: #ccc; cursor: not-allowed; }
        #score-display { font-weight: bold; color: #555; align-self: center; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Daily IAS Prep</h1>
        <p class="subtitle" id="date-display">Date: Loading...</p>

        <div id="quiz-area">
            <div class="question-box" id="question-text">Loading question...</div>
            <div class="options-list" id="options-container"></div>
        </div>

        <div class="nav-buttons">
            <span id="score-display">Score: 0 / 0</span>
            <button class="btn" id="next-btn" onclick="nextQuestion()">Next Question</button>
        </div>
    </div>

    <script>
        // ---------------------------------------------------------
        // LATEST BATCH QUESTIONS (JUMBLED)
        // ---------------------------------------------------------
        const questions = [
            {
                question: "If a commodity is provided free to the public by Government, then:",
                options: ["The opportunity cost is zero.", "The opportunity cost is ignored.", "The opportunity cost is transferred from the consumers of the product to the tax paying public.", "The opportunity cost is transferred from the consumers of the product to the Government."],
                answer: 2
            },
            {
                question: "Increase in absolute and per capita real GNP do not connote a higher level of economic development, if:",
                options: ["Industrial output fails to keep pace with agricultural output.", "Agricultural output fails to keep pace with industrial output.", "Poverty and unemployment increases.", "Imports grow faster than exports."],
                answer: 2
            },
            {
                question: "Despite being a high saving economy, capital formation may not result in significant increase in output due to:",
                options: ["Weak administrative machinery", "Illiteracy", "High population density", "High capital-output ratio"],
                answer: 3
            },
            {
                question: "Which of the following has/have occurred in India after its liberalization of economic policies in 1991?\n1. Share of agriculture in GDP increased enormously.\n2. Share of India's exports in world trade increased.\n3. FDI inflows increased.\n4. India's foreign exchange reserves increased enormously.\n\nSelect the correct answer using the code given below.",
                options: ["1 and 4 only", "2, 3 and 4 only", "2 and 3 only", "1, 2, 3 and 4"],
                answer: 1
            },
            {
                question: "With reference to India economy, consider the following statements:\n1. The rate of growth of real Gross Domestic Product has steadily increased in the last decade.\n2. The Gross Domestic Product at market prices (in rupees) has steadily increased in the last decade.\n\nWhich of the statement given above is/are correct?",
                options: ["1 only", "2 only", "Both 1 and 2", "Neither 1 nor 2"],
                answer: 1
            },
            {
                question: "The problem of international liquidity is related to the non-availability of:",
                options: ["Goods and services", "Gold and silver", "Dollars and other hard currencies", "Exportable surplus"],
                answer: 2
            },
            {
                question: "A decrease in tax to GDP ratio of a country indicates which of the following?\n1. Slowing economic growth rates\n2. Less equitable distribution of national income\n\nSelect the correct answer using the code given below.",
                options: ["1 only", "2 only", "Both 1 and 2", "Neither 1 nor 2"],
                answer: 0
            },
            {
                question: "Economic growth in country X will necessarily have to occur if?",
                options: ["There is technical progress in the world economy", "There is population growth in X", "There is capital formation in X", "The volume of trade grows in the world economy"],
                answer: 2
            },
            {
                question: "The national income of a country for a given period is equal to the __?",
                options: ["Total value of goods and services produced by the nationals", "Sum of total consumption and investment expenditure", "Sum of personal income of all individuals", "Money value of final goods and services produced"],
                answer: 3
            },
            {
                question: "Under which of the following circumstances may 'capital gains' arise?\n1. When there is an increase in the sales of a product\n2. When there is a natural increase in the value of the property owned\n3. When you purchase a painting and there is a growth in its value due to increase in its popularity\n\nSelect the correct answer using the codes given below:",
                options: ["1 Only", "2 & 3 Only", "2 Only", "1, 2 & 3 Only"],
                answer: 1
            },
            {
                question: "In the context of Indian economy, consider the following statements?\n1. The growth rate of GDP has steadily increased in the last five years.\n2. The growth rate in per capita income has steadily increased in the last five years.\n\nWhich of the statements given above is/are correct?",
                options: ["1 only", "2 only", "Both 1 and 2", "Neither 1 nor 2"],
                answer: 3
            },
            {
                question: "A 'closed economy' is an economy in which?",
                options: ["The money supply is fully controlled.", "Deficit financing takes place.", "Only exports take place.", "Neither exports nor imports take place."],
                answer: 3
            },
            {
                question: "With reference to the Indian economy, consider the following statements:\n1. The Gross Domestic Product (GDP) has increased by four times in the last 10 years.\n2. The percentage share of Public Sector in GDP has declined in the last 10 years.\n\nWhich of the statements given above is/are correct?",
                options: ["1 only", "2 only", "Both 1 and 2", "Neither 1 nor 2"],
                answer: 1
            },
            {
                question: "In the context of Indian economy, consider the following pairs:\nTerm - Most appropriate description\n1. Melt down - Fall in stock prices\n2. Recession - Fall in growth rate\n3. Slow down - Fall in GDP\n\nWhich of the pairs given above is / are correctly matched?",
                options: ["1 only", "2 and 3 only", "1 and 3 only", "1, 2 and 3"],
                answer: 0
            },
            {
                question: "Which of the following is / are treated as artificial currency?",
                options: ["ADR", "GDR", "SDR", "Both ADR and SDR"],
                answer: 2
            },
            {
                question: "In essence, what does ‘Due Process of Law’ mean?",
                options: ["The principle of natural justice", "The procedure established by law", "Fair application of Law", "Equality before law"],
                answer: 2
            },
            {
                question: "Which one of the following factors constitutes the best safeguard of liberty in a liberal democracy?",
                options: ["A committed judiciary", "Centralization of powers", "Elected government", "Separation of powers"],
                answer: 3
            },
            {
                question: "Which one of the following statements best reflects the Chief purpose of the ‘Constitution’ of a country?",
                options: ["It determines the objective for the making of necessary laws.", "It enables the creation of political offices and a government.", "It defines and limits the powers of government.", "It secures social justice, social equality and social security."],
                answer: 2
            },
            {
                question: "Constitutional government means:",
                options: ["A representative government of nation with federal structure", "A government whose Head enjoys nominal powers", "A government whose Head enjoys real powers", "A government limited by the terms of the Constitution"],
                answer: 3
            },
            {
                question: "Which one of the following best defines the term ‘State’?",
                options: ["A community of persons permanently occupying a definite territory independent of external control and possessing an organised government", "A politically organised people of a definite territory and possessing an authority to govern them, maintain law and order, protect their natural rights and safeguard their means of sustenance", "A number of persons who have been living in a definite territory for a very long time with their own culture, tradition and government", "A society permanently living in a definite territory with a central authority, an executive responsible to the central authority and an independent judiciary"],
                answer: 0
            },
            {
                question: "A Parliamentary System of Government is one in which:",
                options: ["All political parties in the Parliament are represented in the Government", "The Government is responsible to the Parliament and can be removed by it", "The Government is elected by the people and can be removed by them", "The Government is chosen by the Parliament but cannot be removed by it before completion of a fixed term"],
                answer: 1
            },
            {
                question: "One common agreement between Gandhism and Marxism is:",
                options: ["The final goal of a stateless society", "Class struggle", "Abolition of private property", "Economic determinism"],
                answer: 0
            },
            {
                question: "A constitutional government by definition is a:",
                options: ["Government by legislature", "Popular government", "Multi-party government", "Limited government"],
                answer: 3
            },
            {
                question: "Which one of the following statements is correct?",
                options: ["Rights are claims of the State against the citizens.", "Rights are privileges which are incorporated in the Constitution of a State.", "Rights are claims of the citizens against the State.", "Rights are privileges of a few citizens against the many."],
                answer: 2
            },
            {
                question: "In the context of polity, which one of the following would you accept as the most appropriate definition of liberty?",
                options: ["Protection against the tyranny of political rulers", "Absence of restraint", "Opportunity to do whatever one likes", "Opportunity to develop oneself fully"],
                answer: 3
            },
            {
                question: "Which of the following reflects the most appropriate relationship between law and liberty?",
                options: ["If there are more laws, there is less Liberty.", "If there are no laws there is no liberty.", "If there is liberty, laws have to be made by people.", "If laws are changed too often liberty is in danger."],
                answer: 1
            },
            {
                question: "Which of the following are regarded as the main feature of the “Rule of Law”?\n1. Limitations of powers\n2. Equality before law\n3. People’s responsibility to the Government\n4. Liberty and Civil Rights\n\nSelect the correct answer using the code given below:",
                options: ["1 and 3 only", "2 and 4 only", "1, 2 and 4 only", "1, 2, 3 and 4"],
                answer: 2
            },
            {
                question: "Local self-government can be best explained as an exercise in:",
                options: ["Federalism", "Democratic decentralisation", "Administrative delegation", "Direct democracy"],
                answer: 1
            },
            {
                question: "Democracy’s superior virtue lies in the fact that it calls into activity:",
                options: ["The intelligence and character of ordinary men and women.", "The methods for strengthening executive leadership.", "A superior individual with dynamism and vision.", "A band of dedicated party workers."],
                answer: 0
            },
            {
                question: "The main advantage of the parliamentary form of government is that:",
                options: ["The executive and legislature work independently.", "It provides continuity of policy and is more efficient.", "The executive remains responsible to the legislature.", "The head of the government cannot be changed without election."],
                answer: 2
            },
            {
                question: "One of the implications of equality in society is the absence of:",
                options: ["Privileges", "Restraints", "Competition", "Ideology"],
                answer: 0
            },
            {
                question: "Consider the following statements:\nStatement-I: The atmosphere is heated more by incoming solar radiation than by terrestrial radiation.\nStatement-II: Carbon dioxide and other greenhouse gases in the atmosphere are good absorbers of long wave radiation.\n\nWhich one of the following is correct in respect of the above statements?",
                options: ["Both Statement-I and Statement-II are correct and Statement-II explains Statement-I", "Both Statement-I and Statement-II are correct, but Statement-II does not explain Statement-I", "Statement-I is correct, but Statement-II is incorrect", "Statement-I is incorrect, but Statement-II is correct"],
                answer: 3
            },
            {
                question: "Consider the following statements:\nStatement-I: Thickness of the troposphere at the equator is much greater as compared to poles.\nStatement-II: At the equator, heat is transported to great heights by strong convectional currents.\n\nWhich one of the following is correct in respect of the above statements?",
                options: ["Both Statement-I and Statement-II are correct and Statement-II explains Statement-I", "Both Statement-I and Statement-II are correct, but Statement-II does not explain Statement-I", "Statement-I is correct, but Statement-II is incorrect", "Statement-I is incorrect, but Statement-II is correct"],
                answer: 0
            },
            {
                question: "With reference to \"water vapour\", which of the following statements is/are correct?\n1. It is a gas, the amount of which decreases with altitude.\n2. Its percentage is maximum at the poles.\n\nSelect the answer using the code given below:",
                options: ["1 only", "2 only", "Both 1 and 2", "Neither 1 nor 2"],
                answer: 0
            },
            {
                question: "Consider the following description:\n1. Annual and daily range of temperatures is low.\n2. Precipitation occurs throughout the year.\n3. Precipitation varies between 50 cm — 250 cm.\n\nWhat is this type of climate?",
                options: ["Equatorial climate", "China type climate", "Humid subtropical climate", "Marine West coast climate"],
                answer: 3
            },
            {
                question: "With reference to \"Coriolis force\", which of the following statements are correct?\n1. It increases with increase in wind velocity.\n2. It is maximum at the poles and is absent at the equator.\n\nSelect the answer using the code given below:",
                options: ["1 Only", "2 only", "Both 1 and 2", "Neither 1 nor 2"],
                answer: 2
            },
            {
                question: "Consider the following statements:\n1. High clouds primarily reflect solar radiation and cool the surface of the Earth.\n2. Low clouds have a high absorption of infrared radiation emanating from the Earth’s surface and thus cause a warming effect.\n\nWhich of the statements given above is/are correct?",
                options: ["1 only", "2 only", "Both 1 and 2", "Neither 1 nor 2"],
                answer: 3
            },
            {
                question: "With reference to the Earth's atmosphere, which one of the following statements is correct?",
                options: ["The total amount of insolation received at the equator is roughly about 10 times of that received at the poles.", "Infrared rays constitute roughly two-thirds of insolation.", "Infrared waves are largely absorbed by water vapour that is concentrated in the lower atmosphere.", "Infrared waves are a part of visible spectrum of electromagnetic waves of solar radiation."],
                answer: 2
            },
            {
                question: "Consider the following statements:\nStatement-I: The soil in tropical rain forests is rich in nutrients.\nStatement-II: The high temperature and moisture of tropical rain forests cause dead organic matter in the soil to decompose quickly.\n\nWhich one of the following is correct in respect of the above statements?",
                options: ["Both Statement-I and Statement-II are correct and Statement-II is the correct explanation for Statement-I", "Both Statement-I and Statement-II are correct and Statement-II is not the correct explanation for Statement-I", "Statement-I is correct but Statement-II is incorrect", "Statement-I is incorrect but Statement-II is correct"],
                answer: 3
            },
            {
                question: "The vegetation of savannah consists of grassland with scattered small trees, but extensive areas have no trees. The forest development in such areas is generally kept in check by one or more or a combination of some conditions. Which of the following are such conditions?\n1) Burrowing animals and termites\n2) Fire\n3) Grazing herbivores\n4) Seasonal rainfall\n5) Soil properties\n\nSelect the correct answer using the code given below.",
                options: ["1 and 2", "4 and 5", "2, 3 and 4", "1, 3 and 5"],
                answer: 2
            },
            {
                question: "“Leaf litter decomposes faster than in any other biome and as a result the soil surface is often almost bare. Apart from trees, the vegetation is largely composed of plant forms that reach up into the canopy vicariously, by climbing the trees or growing as epiphytes, rooted on the upper branches of trees”. This is the most likely description of:",
                options: ["Coniferous forest", "Dry deciduous forest", "Mangrove forest", "Tropical rainforest"],
                answer: 3
            },
            {
                question: "Consider the following statements:\n1. Jet streams occur in the Northern Hemisphere only.\n2. Only some cyclones develop an eye.\n3. The temperature inside the eye of a cyclone is nearly 10ºC lesser than that of the surroundings.\n\nWhich of the statements given above is/are correct?",
                options: ["1 only", "2 and 3 only", "2 only", "1 and 3 only"],
                answer: 2
            },
            {
                question: "Consider the following statements:\n1. IOD phenomenon is characterised by a difference in sea surface temperature between tropical Western Indian Ocean and tropical Eastern Pacific Ocean.\n2. An IOD phenomenon can influence an El Nino’s impact on the monsoon.\n\nSelect the correct answer using the code given below:",
                options: ["1 only", "2 only", "Both 1 and 2", "Neither 1 nor 2"],
                answer: 1
            },
            {
                question: "In the context of which of the following do some scientists suggest the use of cirrus cloud thinning technique and the injection of sulphate aerosol into stratosphere?",
                options: ["Creating the artificial rains in some regions", "Reducing the frequency and intensity of tropical cyclones", "Reducing the adverse effects of solar wind on the Earth", "Reducing the global warming"],
                answer: 3
            },
            {
                question: "Why are dewdrops not formed on a cloudy night?",
                options: ["Clouds absorb the radiation released from the Earth’s surface.", "Clouds reflect back the Earth’s radiation.", "The Earth’s surface would have low temperature on cloudy nights.", "Clouds deflect the blowing wind to ground level."],
                answer: 1
            },
            {
                question: "Consider the following statements:\n1. The winds which blow between 30 degrees N and 60 degrees S latitudes throughout the year are known as westerlies.\n2. The moist air masses that cause winter rains in North-Western region of India are part of westerlies.\n\nWhich of the statements given above is/are correct?",
                options: ["1 only", "2 only", "Both 1 and 2", "Neither 1 nor 2"],
                answer: 1
            },
            {
                question: "“Each day is more or less the same, the morning is clear and bright with a sea breeze; as the sun climbs high in the sky, heat mounts up, dark clouds form, than rain comes with thunder and lightning. But rain is soon over.”\nWhich of the following regions is described in the above passage?",
                options: ["Savannah", "Equatorial", "Monsoon", "Mediterranean"],
                answer: 1
            }
        ];

        // Shuffle the questions array so they are jumbled
        for (let i = questions.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [questions[i], questions[j]] = [questions[j], questions[i]];
        }

        // ---------------------------------------------------------

        let currentQuestionIndex = 0;
        let score = 0;
        const questionText = document.getElementById("question-text");
        const optionsContainer = document.getElementById("options-container");
        const scoreDisplay = document.getElementById("score-display");
        const nextBtn = document.getElementById("next-btn");

        function loadQuestion() {
            if (currentQuestionIndex >= questions.length) {
                questionText.innerText = "Daily Goal Completed! 🎉";
                optionsContainer.innerHTML = `<p style='text-align:center; font-size: 1.2em;'>Your Final Score: ${score} / ${questions.length}</p>`;
                nextBtn.style.display = "none";
                scoreDisplay.style.display = "none";
                return;
            }

            const q = questions[currentQuestionIndex];
            
            questionText.innerText = (currentQuestionIndex + 1) + ". " + q.question;
            
            optionsContainer.innerHTML = "";
            nextBtn.disabled = true; 

            q.options.forEach((option, index) => {
                const button = document.createElement("button");
                button.innerText = option;
                button.classList.add("option-btn");
                button.onclick = () => checkAnswer(index, q.answer, button);
                optionsContainer.appendChild(button);
            });
            
            scoreDisplay.innerText = `Score: ${score} / ${questions.length}`;
        }

        function checkAnswer(selectedIndex, correctIndex, button) {
            const buttons = optionsContainer.getElementsByClassName("option-btn");
            
            for(let btn of buttons) {
                btn.disabled = true;
                btn.style.cursor = "default";
            }

            if (selectedIndex === correctIndex) {
                button.classList.add("correct");
                score++;
            } else {
                button.classList.add("wrong");
                buttons[correctIndex].classList.add("correct");
            }

            nextBtn.disabled = false;
        }

        function nextQuestion() {
            currentQuestionIndex++;
            loadQuestion();
        }

        document.getElementById("date-display").innerText = new Date().toDateString();
        loadQuestion();
    </script>
</body>
</html>
