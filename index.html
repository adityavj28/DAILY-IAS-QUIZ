<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily IAS Prep</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background-color: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 600px; width: 100%; }
        h1 { text-align: center; color: #333; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 25px; font-size: 0.9em; }
        .question-box { font-size: 1.1em; margin-bottom: 20px; font-weight: 600; color: #2c3e50; line-height: 1.5; white-space: pre-line; }
        .options-list { list-style-type: none; padding: 0; }
        .option-btn { display: block; width: 100%; padding: 12px; margin-bottom: 10px; background-color: #e9ecef; border: 1px solid #ddd; border-radius: 5px; text-align: left; cursor: pointer; font-size: 0.95em; transition: background 0.2s; line-height: 1.4; }
        .option-btn:hover { background-color: #dbe2e8; }
        .correct { background-color: #d4edda !important; border-color: #c3e6cb !important; color: #155724; }
        .wrong { background-color: #f8d7da !important; border-color: #f5c6cb !important; color: #721c24; }
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 20px; border-top: 1px solid #eee; padding-top: 20px; }
        .btn { padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 1em; }
        .btn:disabled { background-color: #ccc; cursor: not-allowed; }
        #score-display { font-weight: bold; color: #555; align-self: center; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Daily IAS Prep</h1>
        <p class="subtitle" id="date-display">Date: Loading...</p>

        <div id="quiz-area">
            <div class="question-box" id="question-text">Loading question...</div>
            <div class="options-list" id="options-container"></div>
        </div>

        <div class="nav-buttons">
            <span id="score-display">Score: 0 / 0</span>
            <button class="btn" id="next-btn" onclick="nextQuestion()">Next Question</button>
        </div>
    </div>

    <script>
        // ---------------------------------------------------------
        // LATEST BATCH: MARKETS, TRADE, ORGS, SCHEMES (39 QUESTIONS)
        // ---------------------------------------------------------
        const questions = [
            // Markets and Finance
            {
                question: "With reference to the Indian economy, \"Collateral Borrowing and Lending Obligations\" are the instruments of:",
                options: ["Bond market", "Forex market", "Money market", "Stock market"],
                answer: 2
            },
            {
                question: "Consider the following:\n1. Exchange-Traded Funds (ETF)\n2. Motor vehicles\n3. Currency swap\n\nWhich of the above is/are considered financial instruments?",
                options: ["1 only", "2 and 3 only", "1, 2 and 3", "1 and 3 only"],
                answer: 3
            },
            {
                question: "Consider the following markets:\n1. Government Bond Market\n2. Call Money Market\n3. Treasury Bill Market\n4. Stock Market\n\nHow many of the above are included in capital markets?",
                options: ["Only one", "Only two", "Only three", "All four"],
                answer: 1
            },
            {
                question: "Consider the following statements:\n1. In India, Non-Banking Financial Companies can access the Liquidity Adjustment Facility window of the Reserve Bank of India.\n2. In India, Foreign Institutional Investors can hold the Government Securities (G-Secs).\n3. In India, Stock Exchanges can offer separate trading platforms for debts.\n\nWhich of the statements given above is/are correct?",
                options: ["1 and 2 only", "3 only", "1, 2 and 3", "2 and 3 only"],
                answer: 2
            },
            {
                question: "In the context of finance, the term 'beta' refers to:",
                options: ["The process of simultaneous buying and selling of an asset from different platforms", "An investment strategy of a portfolio manager to balance risk versus reward", "A type of systemic risk that arises where perfect hedging is not possible", "A numeric value that measures the fluctuations of a stock to changes in the overall stock market"],
                answer: 3
            },
            {
                question: "In India, which of the following can trade in Corporate Bonds and Government Securities?\n1. Insurance Companies\n2. Pension Funds\n3. Retail Investors\n\nSelect the correct answer using the code given below:",
                options: ["1 and 2 only", "2 and 3 only", "1 and 3 only", "1, 2 and 3"],
                answer: 3
            },
            {
                question: "With reference to the Indian economy, what are the advantages of 'Inflation-Indexed Bonds (IIBs)?\n1. Government can reduce the coupon rates on its borrowing by way of IIBs\n2. IIBs provide protection to the investors from uncertainty regarding inflation.\n3. The interest received as well as capital gains on IIBs are not taxable.\n\nWhich of the statements given above are correct?",
                options: ["1 and 2 only", "2 and 3 only", "1 and 3 only", "1, 2 and 3"],
                answer: 0
            },
            {
                question: "Indian Government Bond Yields are influenced by which of the following?\n1) Actions of the United States Federal Reserve\n2) Actions of the Reserve Bank of India\n3) Inflation and short-term interest rates\n\nSelect the correct answer using the code given below.",
                options: ["1 and 2 only", "2 only", "3 only", "1, 2 and 3"],
                answer: 3
            },
            {
                question: "Which one of the following situations best reflects “Indirect Transfers” often talked about in the media recently with reference to India?",
                options: ["An Indian company investing in a foreign enterprise and paying taxes to the foreign country on the profits arising out of its investment", "A foreign company investing in India and paying taxes to the country of its base on the profits arising out of its investment", "An Indian company purchases tangible assets in a foreign country and sells such assets after their value increases and transfers the proceeds to India", "A foreign company transfers shares and such shares derive their substantial value from assets located in India"],
                answer: 3
            },
            {
                question: "With reference to Convertible Bonds, consider the following statements:\n1. As there is an option to exchange the bond for equity, Convertible Bonds pay a lower rate of interest.\n2. The option to convert to equity affords the bondholder a degree of indexation to rising consumer prices.\n\nWhich of the statements given above is/are correct?",
                options: ["1 only", "2 only", "Both 1 and 2", "Neither 1 nor 2"],
                answer: 2
            },
            {
                question: "Consider the following:\n1) Foreign currency convertible bonds.\n2) Foreign institutional investment with certain conditions\n3) Global depository receipts\n4) Non-resident external deposits\n\nWhich of the above can be included in Foreign Direct Investments?",
                options: ["1, 2 and 3", "3 only", "2 and 4", "1 and 4"],
                answer: 0
            },
            {
                question: "With reference to India, consider the following statements:\n1) Retail investors through demat accounts can invest in 'Treasury Bills' and 'Government of India Debt Bonds' in the primary market.\n2) The 'Negotiated Dealing System-Order Matching' is a government securities trading platform of the Reserve Bank of India.\n3) The 'Central Depository Services Ltd'. is jointly promoted by the Reserved Bank of India and the Bombay Stock Exchange.\n\nWhich of the statements given above is/are correct?",
                options: ["1 only", "1 and 2 only", "3 only", "2 and 3 only"],
                answer: 1
            },
            {
                question: "With reference to the Indian economy, consider the following statements:\n1. 'Commercial Paper' is a short-term unsecured promissory note.\n2. 'Certificate of Deposit' is a long-term instrument issued by the Reserve Bank of India to a corporation.\n3. 'Call Money' is a short-term finance used for interbank transactions.\n4. 'Zero-Coupon Bonds' are the interest-bearing short-term bonds issued by the Scheduled Commercial Banks to corporations.\n\nWhich of the statements given above is/are correct?",
                options: ["1 and 2 only", "4 only", "1 and 3 only", "2, 3 and 4 only"],
                answer: 2
            },

            // Corporate Social Responsibility and Industry
            {
                question: "With reference to Corporate Social Responsibility (CSR) rules in India, consider the following statements:\n1. CSR rules specify that expenditures that benefit the company directly or its employees will not be considered as CSR activities.\n2. CSR rules do not specify minimum spending on CSR activities.\n\nWhich of the statements given above is/are correct?",
                options: ["1 only", "2 only", "both 1 and 2", "Neither 1 nor 2"],
                answer: 0
            },
            {
                question: "Consider the following statements:\nStatement-I: Interest income from the deposits in Infrastructure Investment Trusts (InvITs) distributed to their investors is exempted from tax, but the dividend is taxable.\nStatement-II: InvITs are recognized as borrowers under the ‘Securitization and Reconstruction of Financial Assets and Enforcement of Security Interest Act, 2002’\n\nWhich of the following is correct in respect of the above statements?",
                options: ["Both Statement-I and Statement-II are correct and Statement-II is the correct explanation for Statement-I.", "Both Statement-I and Statement-II are correct and Statement-II is not the correct explanation for Statement-I.", "Statement-I is correct but Statement-II is incorrect.", "Statement-I is incorrect but Statement-II is correct."],
                answer: 3
            },
            {
                question: "Consider the investments in the following assets:\n1. Brand recognition\n2. Inventory\n3. Intellectual property\n4. Mailing list of clients\n\nHow many of the above are considered intangible investments?",
                options: ["Only one", "Only two", "Only three", "All four"],
                answer: 2
            },
            {
                question: "With reference to coal-based thermal power plants in India, consider the following statements:\n1. None of them uses seawater.\n2. None of them is set up in water-stressed district.\n3. None of them is privately owned.\n\nHow many of the above statements are correct?",
                options: ["Only one", "Only two", "All three", "None"],
                answer: 3
            },
            {
                question: "With reference to the expenditure made by an organisation or a company, which of the following statements is/are correct?\n1. Acquiring new technology is capital expenditure.\n2. Debt financing is considered capital expenditure, while equity financing is considered revenue expenditure.\n\nSelect the correct answer using the code given below:",
                options: ["1 only", "2 only", "Both 1 and 2", "Neither 1 nor 2"],
                answer: 0
            },
            {
                question: "In India, which one of the following compiles information on industrial disputes, closures, retrenchments and lay-offs in factories employing workers?",
                options: ["Central Statistics Office", "Department for Promotion of Industry and Internal Trade", "Labour Bureau", "National Technical Manpower Information System"],
                answer: 2
            },
            {
                question: "In India, what is the role of the Coal Controller’s Organization (CCO)?\n1. CCO is the major source of Coal Statistics in Government of India.\n2. It monitors progress of development of Captive Coal/Lignite blocks.\n3. It hears any objection to the Government’s notification relating to acquisition of coal-bearing areas.\n4. It ensures that coal mining companies deliver the coal to end users in the prescribed time.\n\nSelect the correct answer using the code given below:",
                options: ["1, 2 and 3", "3 and 4 only", "1 and 2 only", "1, 2 and 4"],
                answer: 0
            },
            {
                question: "Consider the following statements:\n1. Petroleum and Natural Gas Regulatory Board (PNGRB) is the first regulatory body set up by the Government of India.\n2. One of the tasks of PNGRB is to ensure competitive markets for gas.\n3. Appeals against the decisions of PNGRB go before the Appellate Tribunals for Electricity.\n\nWhich of the statements given above are correct?",
                options: ["1 and 2 only", "2 and 3 only", "1 and 3 only", "1, 2 and 3"],
                answer: 1
            },
            {
                question: "Consider the following statements:\n1. Coal sector was nationalized by the Government of India under Indira Gandhi.\n2. Now, coal blocks are allocated on lottery basis.\n3. Till recently, India imported coal to meet the shortages of domestic supply, but now India is self-sufficient in coal production.\n\nWhich of the statements given above is/are correct?",
                options: ["1 only", "2 and 3 only", "3 only", "1, 2 and 3"],
                answer: 0
            },
            {
                question: "What is the importance of the term \"Interest Coverage Ratio\" of a firm in India?\n1. It helps in understanding the present risk of a firm that a bank is going to give loan to.\n2. It helps in evaluating the emerging risk of a firm that a bank is going to give loan to.\n3. The higher a borrowing firm's level of Interest Coverage Ratio, the worse is its ability to service its debt.\n\nSelect the correct answer using the code given below:",
                options: ["1 and 2 only", "2 only", "1 and 3 only", "1, 2 and 3"],
                answer: 0
            },
            {
                question: "With reference to the management of minor minerals in India, consider the following statements:\n1. Sand is a 'minor mineral' according to the prevailing law in the country.\n2. State Governments have the power to grant mining leases of minor minerals, but the powers regarding the formation of rules related to the grant of minor minerals lie with the Central Government.\n3. State Governments have the power to frame rules to prevent illegal mining of minor minerals.\n\nWhich of the statements given above is/are correct?",
                options: ["1 and 3 only", "2 and 3 only", "3 only", "1, 2 and 3"],
                answer: 0
            },

            // Trade
            {
                question: "Consider the following statements:\nStatement-I: India accounts for 3.2% of global export of goods.\nStatement-II: Many local companies and some foreign companies operating in India have taken advantage of India's 'Production-linked Incentive' scheme.\n\nWhich one of the following is correct in respect of the above statements?",
                options: ["Both Statement-I and Statement-II are correct and Statement-II is the correct explanation for Statement-I", "Both Statement-I and Statement-II are correct and Statement-II is not the correct explanation for Statement-I", "Statement-I is correct but Statement-II is incorrect", "Statement-I is incorrect but Statement-II is correct"],
                answer: 3
            },
            {
                question: "Consider the following statements:\n1. The value of Indo-Sri Lanka trade has consistently increased in the last decade.\n2. “Textile and textile articles” constitute an important item of trade between India and Bangladesh.\n3. In the last five years, Nepal has been the largest trading partner of India in South Asia.\n\nWhich of the statements given above is/are correct?",
                options: ["1 and 2 only", "2 only", "3 only", "1, 2 and 3"],
                answer: 1
            },
            {
                question: "With reference to the international trade of India at present, which of the following statements is/are correct?\n1. India's merchandise exports are less than its merchandise imports.\n2. India's imports of iron and steel, chemicals, fertilisers and machinery have decreased in recent years.\n3. India's exports of services are more than its imports of services.\n4. India suffers from an overall trade/current account deficit.\n\nSelect the correct answer using the code given below:",
                options: ["1 and 2 only", "2 and 4 only", "3 only", "1, 3 and 4 only"],
                answer: 3
            },
            {
                question: "With reference to Trade-Related Investment Measures (TRIMS), which of the following statements is/are correct?\n1. Quantitative restrictions on imports by foreign investors are prohibited.\n2. They apply to investment measures related to trade in both goods and services.\n3. They are not concerned with the regulation of foreign investment.\n\nSelect the correct answer using the code given below:",
                options: ["1 and 2 only", "2 only", "1 and 3 only", "1, 2 and 3"],
                answer: 2
            },
            {
                question: "Among the agricultural commodities imported by India, which one of the following accounts for the highest imports in terms of value in the last five years?",
                options: ["Spices", "Fresh fruits", "Pulses", "Vegetable oils"],
                answer: 3
            },

            // International Organisations and Initiatives
            {
                question: "'Rapid Financing Instrument' and 'Rapid Credit Facility' are related to the provisions of lending by which one of the following?",
                options: ["Asian Development Bank", "International Monetary Fund", "United Nations Environment Programme Finance Initiative", "World Bank"],
                answer: 1
            },
            {
                question: "With reference to the 'G20 Common Framework', consider the following statements:\n1. It is an initiative endorsed by the G20 together with the Paris Club.\n2. It is an initiative to support Low Income Countries with unsustainable debt.\n\nWhich of the statements given above is/are correct?",
                options: ["1 only", "2 only", "Both 1 and 2", "Neither 1 nor 2"],
                answer: 2
            },
            {
                question: "\"Gold Tranche\" (Reserve Tranche) refers to:",
                options: ["A loan system of the World Bank", "One of the operations of a Central Bank", "A credit system granted by WTO to its members", "A credit system granted by IMF to its members"],
                answer: 3
            },
            {
                question: "In which one of the following groups are all the four countries members of G20?",
                options: ["Argentina, Mexico, South Africa and Turkey", "Australia, Canada, Malaysia and New Zealand", "Brazil, Iran, Saudi Arabia and Vietnam", "Indonesia, Japan, Singapore and South Korea"],
                answer: 0
            },
            {
                question: "With reference to 'Water Credit', consider the following statements:\n1) It puts microfinance tools to work in the water and sanitation sector.\n2) It is a global initiative launched under the aegis of the World Health Organization and the World Bank.\n3) It aims to enable the poor people to meet their water needs without depending on subsidies.\n\nWhich of the statements given above are correct?",
                options: ["1 and 2 only", "2 and 3 only", "1 and 3 only", "1, 2 and 3"],
                answer: 2
            },
            {
                question: "With reference to Asian Infrastructure Investment Bank (AIIB), consider the following statements:\n1. AIIB has more than 80 member nations.\n2. India is the largest shareholder in AIIB.\n3. AIIB does not have any members from outside Asia.\n\nWhich of the statements given above is/are correct?",
                options: ["1 only", "2 and 3 only", "1 and 3 only", "1, 2 and 3"],
                answer: 0
            },
            {
                question: "Which one of the following is not a sub-index of the World Bank's 'Ease of Doing Business Index'?",
                options: ["Maintenance of law and order", "Paying taxes", "Registering property", "Dealing with construction permits"],
                answer: 0
            },

            // Government Schemes and Poverty
            {
                question: "With reference to the 'Pradhan Mantri Surakshit Matritva Abhiyan', consider the following statements:\n1. This scheme guarantees a minimum package of antenatal care services to women in their second and third trimesters of pregnancy and six months post-delivery health care service in any government health facility.\n2. Under this scheme, private sector health care providers of certain specialities can volunteer to provide services at nearby government health facilities.\n\nWhich of the statements given above is/are correct?",
                options: ["1 only", "2 only", "Both 1 and 2", "Neither 1 nor 2"],
                answer: 1
            },
            {
                question: "Consider the following statements:\nStatement-I: India's public sector health care system largely focuses on curative care with limited preventive, promotive and rehabilitative care.\nStatement-II: Under India's decentralized approach to health care delivery, the States are primarily responsible for organizing health services.\n\nWhich one of the following is correct in respect of the above statements?",
                options: ["Both Statement-I and Statement-II are correct and Statement-II is the correct explanation for Statement-I", "Both Statement-I and Statement-II are correct and Statement-II is not the correct explanation for Statement-I", "Statement-I is correct but Statement-II is incorrect", "Statement-I is incorrect but Statement-II is correct"],
                answer: 1
            },
            {
                question: "Consider the following statements in relation to Janani Suraksha Yojana:\n1. It is a safe motherhood intervention of the State Health Departments.\n2. Its objective is to reduce maternal and neonatal mortality among poor pregnant women.\n3. It aims to promote institutional delivery among poor pregnant women.\n4. Its objective includes providing public health facilities to sick infants up to one year of age.\n\nHow many of the statements given above are correct?",
                options: ["Only one", "Only two", "Only three", "All four"],
                answer: 1
            },
            {
                question: "Consider the following statements in the context of interventions being undertaken under Anaemia Mukt Bharat Strategy:\n1. It provides prophylactic calcium supplementation for pre-school children, adolescents and pregnant women.\n2. It runs a campaign for delayed cord clamping at the time of child-birth.\n3. It provides for periodic deworming to children and adolescents.\n4. It addresses non-nutritional causes of anaemia in endemic pockets with special focus on malaria, hemoglobinopathies and fluorosis.\n\nHow many of the statements given above are correct?",
                options: ["Only one", "Only two", "Only three", "All four"],
                answer: 2
            },
            {
                question: "With reference to Ayushman Bharat Digital Mission, consider the following statements:\n1. Private and public hospitals must adopt it.\n2. As it aims to achieve universal health coverage, every citizen of India should be part of it ultimately.\n3. It has seamless portability across the country.\n\nWhich of the statements given above is/are correct?",
                options: ["1 and 2 only", "3 only", "1 and 3 only", "1, 2 and 3"],
                answer: 1
            },
            {
                question: "Consider the following statements:\n1. The India Sanitation Coalition is a platform to promote sustainable sanitation and is funded by the Government of India and the World Health Organization.\n2. The National Institute of Urban Affairs is an apex body of the Ministry of Housing and Urban Affairs in Government of India and provides innovative solutions to address the challenges of Urban India.\n\nWhich of the statements given above is/are correct?",
                options: ["1 only", "2 only", "Both 1 and 2", "Neither 1 nor 2"],
                answer: 1
            },
            {
                question: "Atal Innovation Mission is set up under the:",
                options: ["Department of Science and Technology", "Ministry of Labour and Employment", "NITI Aayog", "Ministry of Skill Development and Entrepreneurship"],
                answer: 2
            },
            {
                question: "In a given year in India, official poverty lines are higher in some States than in others because:",
                options: ["Poverty rates vary from State to State", "Price levels vary from State to State", "Gross State Product varies from State to State", "Quality of public distribution varies from State to State"],
                answer: 1
            },
            {
                question: "With reference to the provisions made under the National Food Security Act, 2013, consider the following statements:\n1. The families coming under the category of ‘below poverty line (BPL)’ only are eligible to receive subsidised food grains.\n2. The eldest woman in a household, of age 18 years or above, shall be the head of the household for the purpose of issuance of a ration card.\n3. Pregnant women and lactating mothers are entitled to a ‘take-home ration’ of 1600 calories per day during pregnancy and for six months thereafter.\n\nWhich of the statement/s given above is/are correct?",
                options: ["1 and 2", "2 only", "1 and 3", "3 only"],
                answer: 1
            }
        ];

        // Shuffle the questions array so they are jumbled
        for (let i = questions.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [questions[i], questions[j]] = [questions[j], questions[i]];
        }

        // ---------------------------------------------------------

        let currentQuestionIndex = 0;
        let score = 0;
        const questionText = document.getElementById("question-text");
        const optionsContainer = document.getElementById("options-container");
        const scoreDisplay = document.getElementById("score-display");
        const nextBtn = document.getElementById("next-btn");

        function loadQuestion() {
            if (currentQuestionIndex >= questions.length) {
                questionText.innerText = "Daily Goal Completed! 🎉";
                optionsContainer.innerHTML = `<p style='text-align:center; font-size: 1.2em;'>Your Final Score: ${score} / ${questions.length}</p>`;
                nextBtn.style.display = "none";
                scoreDisplay.style.display = "none";
                return;
            }

            const q = questions[currentQuestionIndex];
            
            questionText.innerText = (currentQuestionIndex + 1) + ". " + q.question;
            
            optionsContainer.innerHTML = "";
            nextBtn.disabled = true; 

            q.options.forEach((option, index) => {
                const button = document.createElement("button");
                button.innerText = option;
                button.classList.add("option-btn");
                button.onclick = () => checkAnswer(index, q.answer, button);
                optionsContainer.appendChild(button);
            });
            
            scoreDisplay.innerText = `Score: ${score} / ${questions.length}`;
        }

        function checkAnswer(selectedIndex, correctIndex, button) {
            const buttons = optionsContainer.getElementsByClassName("option-btn");
            
            for(let btn of buttons) {
                btn.disabled = true;
                btn.style.cursor = "default";
            }

            if (selectedIndex === correctIndex) {
                button.classList.add("correct");
                score++;
            } else {
                button.classList.add("wrong");
                buttons[correctIndex].classList.add("correct");
            }

            nextBtn.disabled = false;
        }

        function nextQuestion() {
            currentQuestionIndex++;
            loadQuestion();
        }

        document.getElementById("date-display").innerText = new Date().toDateString();
        loadQuestion();
    </script>
</body>
</html>
