<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily IAS Prep</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background-color: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 600px; width: 100%; }
        h1 { text-align: center; color: #333; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 25px; font-size: 0.9em; }
        .question-box { font-size: 1.1em; margin-bottom: 20px; font-weight: 600; color: #2c3e50; line-height: 1.5; white-space: pre-line; }
        .options-list { list-style-type: none; padding: 0; }
        .option-btn { display: block; width: 100%; padding: 12px; margin-bottom: 10px; background-color: #e9ecef; border: 1px solid #ddd; border-radius: 5px; text-align: left; cursor: pointer; font-size: 0.95em; transition: background 0.2s; line-height: 1.4; }
        .option-btn:hover { background-color: #dbe2e8; }
        .correct { background-color: #d4edda !important; border-color: #c3e6cb !important; color: #155724; }
        .wrong { background-color: #f8d7da !important; border-color: #f5c6cb !important; color: #721c24; }
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 20px; border-top: 1px solid #eee; padding-top: 20px; }
        .btn { padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 1em; }
        .btn:disabled { background-color: #ccc; cursor: not-allowed; }
        #score-display { font-weight: bold; color: #555; align-self: center; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Daily IAS Prep</h1>
        <p class="subtitle" id="date-display">Date: Loading...</p>

        <div id="quiz-area">
            <div class="question-box" id="question-text">Loading question...</div>
            <div class="options-list" id="options-container"></div>
        </div>

        <div class="nav-buttons">
            <span id="score-display">Score: 0 / 0</span>
            <button class="btn" id="next-btn" onclick="nextQuestion()">Next Question</button>
        </div>
    </div>

    <script>
        // ---------------------------------------------------------
        // ONLY THE NEWEST TEXT DUMP QUESTIONS (JUMBLED)
        // ---------------------------------------------------------
        const questions = [
            {
                question: "Which of the following organisms perform waggle dance for others of their kin to indicate the direction and the distance to a source of their food?",
                options: ["Butterflies", "Dragonflies", "Honeybees", "Wasps"],
                answer: 2
            },
            {
                question: "Consider the following statements:\nStatement-I: Rainfall is one of the reasons for weathering of rocks.\nStatement-II: Rain water contains carbon dioxide in solution.\nStatement-III: Rain water contains atmospheric oxygen.\n\nWhich one of the following is correct in respect of the above statements?",
                options: ["Both Statement-II and Statement-III are correct and both of them explain Statement-I", "Both Statement-II and Statement-III are correct, but only one of them explains Statement-I", "Only one of the Statements II and III is correct and that explains Statement-I", "Neither Statement-II nor Statement-III is correct"],
                answer: 0
            },
            {
                question: "Consider following statements:\n1. Some mushrooms have medicinal properties.\n2. Some mushrooms have psycho-active properties.\n3. Some mushrooms have insecticidal properties.\n4. Some mushrooms have bioluminescent properties.\n\nHow many of the above statements are correct?",
                options: ["Only one", "Only two", "Only three", "All four"],
                answer: 3
            },
            {
                question: "Which of the following have species that can establish symbiotic relationship with other organisms?\n1) Cnidarians\n2) Fungi\n3) Protozoa\n\nSelect the correct answer using the code given below:",
                options: ["1 and 2 only", "2 and 3 only", "1 and 3 only", "1, 2 and 3"],
                answer: 3
            },
            {
                question: "Consider the following pairs:\nCountry - Animal found in its natural habitat\n1. Brazil - Indri\n2. Indonesia - Elk\n3. Madagascar - Bonobo\n\nHow many of the pairs given above are correctly matched?",
                options: ["Only one", "Only two", "All three", "None"],
                answer: 3
            },
            {
                question: "Consider the following:\n1. Electromagnetic radiation\n2. Geothermal energy\n3. Gravitational force\n4. Plate movements\n5. Rotation of the earth\n6. Revolution of the earth\n\nWhich of the above are responsible for bringing dynamic changes on the surface of the earth?",
                options: ["1, 2, 3, and 4 only", "1, 3, 5 and 6 only", "2, 4, 5, and 6 only", "1, 2, 3, 4, 5, and 6"],
                answer: 3
            },
            {
                question: "Assertion (A): The same face of the Moon is always presented to the Earth.\nReason (R): The Moon rotates about its own axis in 23 days which is about the same time that takes to orbit the Earth.",
                options: ["Both (A) and (R) are individually true and R is the correct explanation of A", "Both (A) and (R) are individually true and R is not the correct explanation of A", "A is true but R is false", "A is false but R is true"],
                answer: 2
            },
            {
                question: "Which one of the following sets of elements was primarily responsible for the origin of life on the Earth?",
                options: ["Hydrogen, Oxygen, Sodium", "Carbon, Hydrogen, Nitrogen", "Oxygen, Calcium, Phosphorus", "Carbon, Hydrogen, Potassium"],
                answer: 1
            },
            {
                question: "Contour Bunding is a method of soil conservation used in?",
                options: ["Desert margins, liable to strong wind action", "Low flat plains, close to stream courses, liable to flooding", "Scrublands, liable to spread of weed growth", "None of the above"],
                answer: 3
            },
            {
                question: "Consider the following kinds of organisms:\n1) Copepods\n2) Cyanobacteria\n3) Diatoms\n4) Foraminifera\n\nWhich of the above are primary producers in the food chains of oceans?",
                options: ["1 and 2", "2 and 3", "3 and 4", "1 and 4"],
                answer: 1
            },
            {
                question: "A person stood alone in a desert on a dark night and wanted to reach his village which was situated 5 km east of the point where he was standing. He had no instruments to find the direction but he located the polestar. The most convenient way now to reach his village is to walk in the:",
                options: ["Direction facing the polestar", "Direction opposite to the polestar", "Direction keeping the polestar to his left", "Direction keeping the polestar to his right"],
                answer: 2
            },
            {
                question: "Ilmenite and rutile, abundantly available in certain coastal tracts of India, are rich sources of which one of the following?",
                options: ["Aluminium", "Copper", "Iron", "Titanium"],
                answer: 3
            },
            {
                question: "What is the approximate mean velocity with which the Earth moves round the Sun in its orbit?",
                options: ["20 km/s", "30 km/s", "40 km/s", "50 km/s"],
                answer: 1
            },
            {
                question: "Consider the following:\n1. Carabid beetles\n2. Centipedes\n3. Flies\n4. Termites\n5. Wasps\n\nParasitoid species are found in how many of the above kind of organisms?",
                options: ["Only two", "Only three", "Only four", "All five"],
                answer: 1
            },
            {
                question: "Consider the following statements:\n1. Some species of turtles are herbivores.\n2. Some species of fish are herbivores.\n3. Some species of marine mammals are herbivores.\n4. Some species of snakes are viviparous.\n\nWhich of the statements given above is/are correct?",
                options: ["1 and 3 only", "2, 3 and 4 only", "2 and 4 only", "1, 2, 3 and 4"],
                answer: 3
            },
            {
                question: "On 21st June, the Sun:",
                options: ["Does not set below the horizon at the Arctic Circle", "Does not set below the horizon at Antarctic Circle", "Shines vertically overhead at noon on the Equator", "Shines vertically overhead at the Tropic of Capricorn"],
                answer: 0
            },
            {
                question: "Consider the following statements:\n1. Lions do not have a particular breeding season.\n2. Unlike most other big cats, cheetahs do not roar.\n3. Unlike male lions, male leopards do not proclaim their territory by scent marking.\n\nWhich of the statements given above are correct?",
                options: ["1 and 2 only", "2 and 3 only", "1 and 3 only", "1, 2 and 3"],
                answer: 0
            },
            {
                question: "Which of the following pairs is/are correctly matched?\nTheory/Law : Associated Scientist\n1. Continental Drift: Edwin Hubble\n2. Expansion of Universe: Alfred Wegener\n3. Photoelectric Effect: Albert Einstein\n\nSelect the correct answer using the code given below:",
                options: ["2 and 3 only", "3 only", "2 only", "1 only"],
                answer: 1
            },
            {
                question: "Assertion (A): Existence of human life on Venus is highly improbable.\nReason (R): Venus has an extremely high level of carbon dioxide in its atmosphere.",
                options: ["Both (A) and (R) are individually true and R is the correct explanation of A", "Both (A) and (R) are individually true and R is not the correct explanation of A", "A is true but R is false", "A is false but R is true"],
                answer: 0
            },
            {
                question: "The organisms 'Cicada, Froghopper and Pond skater' are:",
                options: ["Birds", "Fish", "Insects", "Reptiles"],
                answer: 2
            },
            {
                question: "Consider the following statements:\n1. In a seismograph, P waves recorded earlier than S waves.\n2. In P waves, the individual particles vibrate to and fro in the direction of wave propagation whereas in S waves, the particles vibrate up and down at right angles to the direction of wave propagation.\n\nWhich of the statements given above is/are correct?",
                options: ["1 only", "2 only", "Both 1 and 2", "Neither 1 nor 2"],
                answer: 2
            },
            {
                question: "Which of the following are detritivores?\n1) Earthworms\n2) Jellyfish\n3) Millipedes\n4) Seahorses\n5) Woodlice\n\nSelect the correct answer using the code given below.",
                options: ["1, 2 & 4 only", "2, 3, 4 & 5 only", "1, 3 & 5 only", "1, 2, 3, 4 & 5"],
                answer: 2
            },
            {
                question: "The word ‘Denisovan’ is sometimes mentioned in media in reference to:",
                options: ["Fossils of a kind of dinosaurs", "An early human species", "A cave system found in North-East India", "A geological period in the history of Indian subcontinent"],
                answer: 1
            },
            {
                question: "Consider the following:\n1. Pyroclastic debris\n2. Ash and dust\n3. Nitrogen compounds\n4. Sulphur compounds\n\nHow many of the above are products of volcanic eruptions?",
                options: ["Only one", "Only two", "Only three", "All four"],
                answer: 3
            },
            {
                question: "In the structure of planet Earth, below the mantle, the core is mainly made up of which one of the following?",
                options: ["Aluminium", "Chromium", "Iron", "Silicon"],
                answer: 2
            },
            {
                question: "On June 21 every year, which of the following latitude(s) experience(s) a sunlight of more than 12 hours?\n1. Equator\n2. Tropic of Cancer\n3. Tropic of Capricorn\n4. Arctic Circle\n\nSelect the correct answer using the code given below:",
                options: ["1 only", "2 only", "3 and 4", "2 and 4"],
                answer: 3
            },
            {
                question: "Which of the is/are the possible consequences of heavy sand mining in riverbeds?\n1. Decreased salinity in the water\n2. Pollution of groundwater\n3. Lowering of the water table\n\nSelect the correct answer using the code below:",
                options: ["1 only", "2 and 3 only", "1 and 3 only", "1, 2 and 3"],
                answer: 1
            },
            {
                question: "Consider the following:\n1. Butterflies\n2. Fish\n3. Frogs\n\nHow many of the above have poisonous species among them?",
                options: ["Only one", "Only two", "All three", "None"],
                answer: 2
            },
            {
                question: "Which of the following makes a tool with a stick to scrape insects from a hole in a tree or a log of wood?",
                options: ["Fishing cat", "Orangutan", "Otter", "Sloth bear"],
                answer: 1
            },
            {
                question: "With reference to the soil conservation, consider the following practices:\n1. Crop rotation\n2. Sand fences\n3. Terracing\n4. Wind breaks\n\nWhich of the above are considered appropriate methods for soil conservation in India?",
                options: ["1, 2 and 3 only", "2 and 4 only", "1, 3 and 4 only", "1, 2, 3 and 4"],
                answer: 2
            },
            {
                question: "In case of which one of the following biogeochemical cycles the weathering of rocks is the main source of release of nutrient to enter the cycle?",
                options: ["Carbon cycle", "Nitrogen cycle", "Phosphorus cycle", "Sulphur cycle"],
                answer: 2
            },
            {
                question: "Which of the following phenomena might have influenced the evolution of organisms?\n1. Continental drift\n2. Glacial cycles\n\nSelect the correct answer using the code given below.",
                options: ["1 only", "2 only", "Both 1 and 2", "Neither 1 nor 2"],
                answer: 2
            },
            {
                question: "In the northern hemisphere, the longest day of the year normally occurs in the:",
                options: ["First half of the month of June", "Second half of the month of June", "First half of the month of July", "Second half of the month of July"],
                answer: 1
            },
            {
                question: "Which one of the following shows a unique relationship with an insect that has co-evolved with it and that is the only insect that can pollinate this tree?",
                options: ["Fig", "Mahua", "Sandalwood", "Silk cotton"],
                answer: 0
            },
            {
                question: "In order of their distance from the Sun, which of the following planets lie between Mars and Uranus?",
                options: ["Earth and Jupiter", "Jupiter and Saturn", "Saturn and Earth", "Saturn and Neptune"],
                answer: 1
            },
            {
                question: "Consider the following plants:\n1. Groundnut\n2. Horse-gram\n3. Soybean\n\nHow many of the above belong to the pea family?",
                options: ["Only one", "Only two", "All three", "None"],
                answer: 2
            },
            {
                question: "On the planet earth, most of the freshwater exists as ice caps and glaciers. Out of the remaining freshwater, the largest proportion?",
                options: ["Is found in atmosphere as moisture and clouds", "Is found in freshwater lakes and rivers", "Exists as groundwater", "Exists as soil moisture"],
                answer: 2
            },
            {
                question: "Variations in the length of daytime and night-time from season to season are due to?",
                options: ["The earth’s rotation on its axis", "The earth’s revolution round the sun in an elliptical manner", "Latitudinal position of the place", "Revolution of the earth on a titled axis"],
                answer: 3
            },
            {
                question: "“If rainforests and tropical forests are the lungs of the Earth, then surely wetlands function as its kidneys.” Which one of the following functions of wetlands best reflects the above statement?",
                options: ["The water cycle in wetlands involves surface runoff, subsoil percolation and evaporation.", "Algae form the nutrient base upon which fish, crustaceans, molluscs, birds, reptiles and mammals thrive.", "Wetlands play a vital role in maintaining sedimentation balance and soil stabilization.", "Aquatic plants absorb heavy metals and excess nutrients."],
                answer: 3
            }
        ];

        // ---------------------------------------------------------

        let currentQuestionIndex = 0;
        let score = 0;
        const questionText = document.getElementById("question-text");
        const optionsContainer = document.getElementById("options-container");
        const scoreDisplay = document.getElementById("score-display");
        const nextBtn = document.getElementById("next-btn");

        function loadQuestion() {
            if (currentQuestionIndex >= questions.length) {
                questionText.innerText = "Daily Goal Completed! 🎉";
                optionsContainer.innerHTML = `<p style='text-align:center; font-size: 1.2em;'>Your Final Score: ${score} / ${questions.length}</p>`;
                nextBtn.style.display = "none";
                scoreDisplay.style.display = "none";
                return;
            }

            const q = questions[currentQuestionIndex];
            
            questionText.innerText = (currentQuestionIndex + 1) + ". " + q.question;
            
            optionsContainer.innerHTML = "";
            nextBtn.disabled = true; 

            q.options.forEach((option, index) => {
                const button = document.createElement("button");
                button.innerText = option;
                button.classList.add("option-btn");
                button.onclick = () => checkAnswer(index, q.answer, button);
                optionsContainer.appendChild(button);
            });
            
            scoreDisplay.innerText = `Score: ${score} / ${questions.length}`;
        }

        function checkAnswer(selectedIndex, correctIndex, button) {
            const buttons = optionsContainer.getElementsByClassName("option-btn");
            
            for(let btn of buttons) {
                btn.disabled = true;
                btn.style.cursor = "default";
            }

            if (selectedIndex === correctIndex) {
                button.classList.add("correct");
                score++;
            } else {
                button.classList.add("wrong");
                buttons[correctIndex].classList.add("correct");
            }

            nextBtn.disabled = false;
        }

        function nextQuestion() {
            currentQuestionIndex++;
            loadQuestion();
        }

        document.getElementById("date-display").innerText = new Date().toDateString();
        loadQuestion();
    </script>
</body>
</html>
