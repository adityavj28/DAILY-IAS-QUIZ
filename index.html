<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily IAS Prep</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background-color: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 600px; width: 100%; }
        h1 { text-align: center; color: #333; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 25px; font-size: 0.9em; }
        .question-box { font-size: 1.1em; margin-bottom: 20px; font-weight: 600; color: #2c3e50; line-height: 1.5; white-space: pre-line; }
        .options-list { list-style-type: none; padding: 0; }
        .option-btn { display: block; width: 100%; padding: 12px; margin-bottom: 10px; background-color: #e9ecef; border: 1px solid #ddd; border-radius: 5px; text-align: left; cursor: pointer; font-size: 0.95em; transition: background 0.2s; line-height: 1.4; }
        .option-btn:hover { background-color: #dbe2e8; }
        .correct { background-color: #d4edda !important; border-color: #c3e6cb !important; color: #155724; }
        .wrong { background-color: #f8d7da !important; border-color: #f5c6cb !important; color: #721c24; }
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 20px; border-top: 1px solid #eee; padding-top: 20px; }
        .btn { padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 1em; }
        .btn:disabled { background-color: #ccc; cursor: not-allowed; }
        #score-display { font-weight: bold; color: #555; align-self: center; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Daily IAS Prep</h1>
        <p class="subtitle" id="date-display">Date: Loading...</p>

        <div id="quiz-area">
            <div class="question-box" id="question-text">Loading question...</div>
            <div class="options-list" id="options-container"></div>
        </div>

        <div class="nav-buttons">
            <span id="score-display">Score: 0 / 0</span>
            <button class="btn" id="next-btn" onclick="nextQuestion()">Next Question</button>
        </div>
    </div>

    <script>
        // ---------------------------------------------------------
        // ONLY THE 36 NEWEST QUESTIONS (JUMBLED)
        // ---------------------------------------------------------
        const questions = [
            {
                question: "Which one of the following sets of elements was primarily responsible for the origin of life on the Earth?",
                options: ["Hydrogen, Oxygen, Sodium", "Carbon, Hydrogen, Nitrogen", "Oxygen, Calcium, Phosphorus", "Carbon, Hydrogen, Potassium"],
                answer: 1
            },
            {
                question: "With reference to the soil conservation, consider the following practices:\n1. Crop rotation\n2. Sand fences\n3. Terracing\n4. Wind breaks\n\nWhich of the above are considered appropriate methods for soil conservation in India?",
                options: ["1, 2 and 3 only", "2 and 4 only", "1, 3 and 4 only", "1, 2, 3 and 4"],
                answer: 3
            },
            {
                question: "A person stood alone in a desert on a dark night and wanted to reach his village which was situated 5 km east of the point where he was standing. He had no instruments to find the direction but he located the polestar. The most convenient way now to reach his village is to walk in the:",
                options: ["Direction facing the polestar", "Direction opposite to the polestar", "Direction keeping the polestar to his left", "Direction keeping the polestar to his right"],
                answer: 2
            },
            {
                question: "In the structure of planet Earth, below the mantle, the core is mainly made up of which one of the following?",
                options: ["Aluminium", "Chromium", "Iron", "Silicon"],
                answer: 2
            },
            {
                question: "Which of the following pairs is/are correctly matched?\nTheory/Law : Associated Scientist\n1. Continental Drift: Edwin Hubble\n2. Expansion of Universe: Alfred Wegener\n3. Photoelectric Effect: Albert Einstein\n\nSelect the correct answer using the code given below:",
                options: ["2 and 3 only", "3 only", "2 only", "1 only"],
                answer: 1
            },
            {
                question: "In order of their distance from the Sun, which of the following planets lie between Mars and Uranus?",
                options: ["Earth and Jupiter", "Jupiter and Saturn", "Saturn and Earth", "Saturn and Neptune"],
                answer: 1
            },
            {
                question: "What is the approximate mean velocity with which the Earth moves round the Sun in its orbit?",
                options: ["20 km/s", "30 km/s", "40 km/s", "50 km/s"],
                answer: 1
            },
            {
                question: "Assertion (A): The same face of the Moon is always presented to the Earth.\nReason (R): The Moon rotates about its own axis in 23 days which is about the same time that takes to orbit the Earth.",
                options: ["Both (A) and (R) are individually true and R is the correct explanation of A", "Both (A) and (R) are individually true and R is not the correct explanation of A", "A is true but R is false", "A is false but R is true"],
                answer: 2
            },
            {
                question: "Assertion (A): Existence of human life on Venus is highly improbable.\nReason (R): Venus has an extremely high level of carbon dioxide in its atmosphere.",
                options: ["Both (A) and (R) are individually true and R is the correct explanation of A", "Both (A) and (R) are individually true and R is not the correct explanation of A", "A is true but R is false", "A is false but R is true"],
                answer: 0
            },
            {
                question: "Consider the following statements:\n1. The axis of the earth magnetic field is inclined at 23 to the geographic axis of the earth.\n2. The earth’s magnetic pole in the northern hemisphere is located on a peninsula in northern Canada.\n3. Earth’s magnetic equator passes through Thumba in South India.\n\nWhich of the statements is/are correct?",
                options: ["1, 2 and 3", "2 and 3", "2 only", "3 only"],
                answer: 1
            },
            {
                question: "Consider the following statements:\n1) Total land area of earth is approximately 1475 lakh square kilometres.\n2) Ratio of land area to water area of earth is approximately 1: 4.\n3) Maximum percentage of earth’s water is in the Pacific Ocean.\n\nWhich of the statements given above are correct?",
                options: ["1 and 3", "2 and 3", "1 only", "3 only"],
                answer: 0
            },
            {
                question: "Which one of the following is the correct sequence of the given Continents in the decreasing order of their percentage of earth’s land?",
                options: ["North America, Africa, South America, Europe", "Africa, North America, South America, Europe", "North America, Africa, Europe, South America", "Africa, North America, Europe, South America"],
                answer: 1
            },
            {
                question: "Which of the following cause earthquakes?\n1. Development of a fault\n2. Movement along a fault\n3. Impact produced by a volcanic eruption\n4. Folding of rocks",
                options: ["1, 2 and 3", "2 and 4", "1, 3 and 4", "1, 2, 3 and 4"],
                answer: 3
            },
            {
                question: "Identify the correct order of the processes of soil- erosion from the following:",
                options: ["Splash erosion, Sheet erosion, Rill erosion, Gully erosion", "Sheet erosion, Splash erosion, Gully erosion, Rill erosion", "Rill erosion, Gully erosion, Sheet erosion, Splash erosion", "Gully erosion, Rill erosion, Sheet erosion, Splash erosion"],
                answer: 0
            },
            {
                question: "Consider the following statements:\nI. Most magmas are a combination of liquid, solid and gas.\nII. Water vapour and carbon dioxide are the principal gases dissolved in a magma.\nIII. Basaltic magma is hotter than the silicic magma.\nIV. The magma solidified between sedimentary rocks in a horizontal position is known as dike.\n\nWhich of these statements are correct?",
                options: ["I, II and III", "II, III and IV", "I and IV", "I, II and IV"],
                answer: 0
            },
            {
                question: "Who among the following rulers of Vijayanagara Empire constructed a large dam across Tungabhadra River and a canal-cum-aqueduct several kilometers long from the river to the capital city?",
                options: ["Devaraya I", "Mallikarjuna", "Vira Vijaya", "Virupaksha"],
                answer: 0
            },
            {
                question: "In medieval India, the term “Fanam” referred to:",
                options: ["Clothing", "Coins", "Ornaments", "Weapons"],
                answer: 1
            },
            {
                question: "Which of the following is the correct sequence in ascending order in terms of size?",
                options: ["Paragana, Sarkar, Suba", "Sarkar, Paragana, Suba", "Suba, Sarkar, Paragana", "Paragana, Suba, Sarkar"],
                answer: 0
            },
            {
                question: "With reference to ‘Indian history, consider the following statements:\n1. The first Mongol invasion of India happened during the reign of Jalal-ud-din Khalji.\n2. During the reign of Ala-ud-din Khalji, one Mongol assault marched up to Delhi and besieged the city.\n3. Muhammad-bin-Tughlaq temporarily lost portions of north-west of his kingdom to Mongols.\n\nWhich of the statements given above is/are correct?",
                options: ["1 and 2", "2 only", "1 and 3", "3 only"],
                answer: 1
            },
            {
                question: "Consider the following statements:\n1) It was during the reign of Iltutmish that Chengiz Khan reached the Indus in pursuit of the fugitive Khwarezm prince.\n2) It was during the reign of Muhammad bin Tughluq that Taimur occupied Multan and crossed the Indus.\n3) It was during the reign of Deva Raya II of Vijayanagara Empire that Vasco da Gama reached the coast of Kerala.\n\nWhich of the statements given above is/are correct?",
                options: ["1 only", "1 and 2", "3 only", "2 and 3"],
                answer: 0
            },
            {
                question: "With reference to the history of India, consider the following pairs:\n1. Aurang: In-charge of treasury of the State\n2. Banian: Indian agent of the East India Company\n3. Mirasidar: Designated revenue payer to the State\n\nWhich of the pairs given above is/are correctly matched?",
                options: ["1 and 2 only", "2 and 3 only", "3 only", "1, 2 and 3"],
                answer: 1
            },
            {
                question: "With reference to Indian history, which of the following were known as “Kulah-Daran”?",
                options: ["Arab merchants", "Qalandars", "Persian calligraphists", "Sayyids"],
                answer: 3
            },
            {
                question: "Which of the following activities constitute a real sector in the economy?\n1. Farmers harvesting their crops\n2. Textile mills converting raw cotton into fabrics\n3. A commercial bank lending money to a trading company\n4. A corporate body issuing Rupee Denominated Bonds overseas\n\nSelect the correct answer using the codes given below:",
                options: ["1 and 2", "2, 3 and 4 only", "1, 3 and 4 only", "1, 2, 3 and 4"],
                answer: 0
            },
            {
                question: "With reference to the Indian economy after the 1991 economic liberalization, consider the following statements:\n1. Worker productivity (Rs. per worker at 2004-05 prices) increased in urban areas while it decreased in rural areas.\n2. The percentage share of rural areas in the workforce steadily increased.\n3. In rural areas, the growth in non-farm economy increased.\n4. The growth rate in rural employment decreased.\n\nWhich of the statements given above is/are Correct?",
                options: ["1 and 2 only", "3 and 4 only", "3 only", "1, 2 and 4 only"],
                answer: 1
            },
            {
                question: "Which among the following steps is most likely to be taken at the time of an economic recession?",
                options: ["Cut in tax rates accompanied by increase in interest rate", "Increase in expenditure on public projects", "Increase in tax rates accompanied by reduction of interest rate", "Reduction of expenditure on public projects"],
                answer: 1
            },
            {
                question: "Consider the following statements:\n1. Purchasing Power Parity (PPP) exchange rates are calculated by comparing the prices of the same basket of goods and services in different countries.\n2. In terms of PPP dollars, India is the sixth largest economy in the world.\n\nWhich of the statements given above is/are correct?",
                options: ["1 only", "2 only", "Both 1 and 2", "Neither 1 nor 2"],
                answer: 0
            },
            {
                question: "Other things remaining unchanged, market demand for a good might increase if:\n1) Price of its substitute increases\n2) Price of its complement increases\n3) The good is an inferior good and income of the consumers increases\n4) Its price falls\n\nWhich of the above statements are correct?",
                options: ["1 and 4 only", "2, 3 and 4", "1, 3 and 4", "1, 2 and 3"],
                answer: 0
            },
            {
                question: "Which one of the following statements correctly describes the meaning of legal tender money?",
                options: ["The money which is tendered in courts of law to defray the fee of legal cases", "The money which a creditor is under compulsion to accept in settlement of his claims", "The bank money in the form of cheques, drafts, bill of exchange, etc.", "The metallic money in circulation in a country"],
                answer: 1
            },
            {
                question: "If a commodity is provided free to the public by Government, then:",
                options: ["The opportunity cost is zero.", "The opportunity cost is ignored.", "The opportunity cost is transferred from the consumers of the product to the tax paying public.", "The opportunity cost is transferred from the consumers of the product to the Government."],
                answer: 2
            },
            {
                question: "Increase in absolute and per capita real GNP do not connote a higher level of economic development, if:",
                options: ["Industrial output fails to keep pace with agricultural output.", "Agricultural output fails to keep pace with industrial output.", "Poverty and unemployment increases.", "Imports grow faster than exports."],
                answer: 2
            },
            {
                question: "Despite being a high saving economy, capital formation may not result in significant increase in output due to:",
                options: ["Weak administrative machinery", "Illiteracy", "High population density", "High capital-output ratio"],
                answer: 3
            },
            {
                question: "Which of the following has/have occurred in India after its liberalization of economic policies in 1991?\n1. Share of agriculture in GDP increased enormously.\n2. Share of India's exports in world trade increased.\n3. FDI inflows increased.\n4. India's foreign exchange reserves increased enormously.",
                options: ["1 and 4 only", "2, 3 and 4 only", "2 and 3 only", "1, 2, 3 and 4"],
                answer: 1
            },
            {
                question: "With reference to India economy, consider the following statements:\n1. The rate of growth of real Gross Domestic Product has steadily increased in the last decade.\n2. The Gross Domestic Product at market prices (in rupees) has steadily increased in the last decade\n\nWhich of the statement given above is/are correct?",
                options: ["1 only", "2 only", "Both 1 and 2", "Neither 1 nor 2"],
                answer: 1
            },
            {
                question: "The problem of international liquidity is related to the non-availability of:",
                options: ["Goods and services", "Gold and silver", "Dollars and other hard currencies", "Exportable surplus"],
                answer: 2
            },
            {
                question: "A decrease in tax to GDP ratio of a country indicates which of the following?\n1. Slowing economic growth rates\n2. Less equitable distribution of national income",
                options: ["1 only", "2 only", "Both 1 and 2", "Neither 1 nor 2"],
                answer: 0
            },
            {
                question: "Economic growth in country X will necessarily have to occur if?",
                options: ["There is technical progress in the world economy", "There is population growth in X", "There is capital formation in X", "The volume of trade grows in the world economy"],
                answer: 2
            }
        ];

        // Shuffle the questions array so they are jumbled
        for (let i = questions.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [questions[i], questions[j]] = [questions[j], questions[i]];
        }

        // ---------------------------------------------------------

        let currentQuestionIndex = 0;
        let score = 0;
        const questionText = document.getElementById("question-text");
        const optionsContainer = document.getElementById("options-container");
        const scoreDisplay = document.getElementById("score-display");
        const nextBtn = document.getElementById("next-btn");

        function loadQuestion() {
            if (currentQuestionIndex >= questions.length) {
                questionText.innerText = "Daily Goal Completed! 🎉";
                optionsContainer.innerHTML = `<p style='text-align:center; font-size: 1.2em;'>Your Final Score: ${score} / ${questions.length}</p>`;
                nextBtn.style.display = "none";
                scoreDisplay.style.display = "none";
                return;
            }

            const q = questions[currentQuestionIndex];
            
            questionText.innerText = (currentQuestionIndex + 1) + ". " + q.question;
            
            optionsContainer.innerHTML = "";
            nextBtn.disabled = true; 

            q.options.forEach((option, index) => {
                const button = document.createElement("button");
                button.innerText = option;
                button.classList.add("option-btn");
                button.onclick = () => checkAnswer(index, q.answer, button);
                optionsContainer.appendChild(button);
            });
            
            scoreDisplay.innerText = `Score: ${score} / ${questions.length}`;
        }

        function checkAnswer(selectedIndex, correctIndex, button) {
            const buttons = optionsContainer.getElementsByClassName("option-btn");
            
            for(let btn of buttons) {
                btn.disabled = true;
                btn.style.cursor = "default";
            }

            if (selectedIndex === correctIndex) {
                button.classList.add("correct");
                score++;
            } else {
                button.classList.add("wrong");
                buttons[correctIndex].classList.add("correct");
            }

            nextBtn.disabled = false;
        }

        function nextQuestion() {
            currentQuestionIndex++;
            loadQuestion();
        }

        document.getElementById("date-display").innerText = new Date().toDateString();
        loadQuestion();
    </script>
</body>
</html>
