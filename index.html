            { question: "In the context of finance, the term 'beta' refers to:", options: ["The process of simultaneous buying and selling of an asset from different platforms", "An investment strategy of a portfolio manager to balance risk versus reward", "A type of systemic risk that arises where perfect hedging is not possible", "A numeric value that measures the fluctuations of a stock to changes in the overall stock market"], answer: 3 },

            { question: "Which one of the following situations best reflects “Indirect Transfers” often talked about in the media recently with reference to India?", options: ["An Indian company investing in a foreign enterprise and paying taxes to the foreign country on the profits arising out of its investment", "A foreign company investing in India and paying taxes to the country of its base on the profits arising out of its investment", "An Indian company purchases tangible assets in a foreign country and sells such assets after their value increases and transfers the proceeds to India", "A foreign company transfers shares and such shares derive their substantial value from assets located in India"], answer: 3 },

            // --- BATCH 2: Economy / CSR (10 Questions) ---

            // --- BATCH 3: Environment / Fauna (15 Questions) ---
            { question: "Consider the following statements:\nStatement I: The Indian Flying Fox is placed under the \"vermin\" category in the Wild Life (Protection) Act, 1972.\nStatement-II: The Indian Flying Fox feeds on the blood of other animals.\n\nWhich one of the following is correct in respect of the above statements?", options: ["Statement-I and Statement-II are correct and Statement-II explains Statement-I", "Both Statement-I and Statement-II are correct, but Statement-II does not explain Statement-I", "Statement-I is correct, but Statement-II is incorrect", "Statement-I is incorrect, but Statement-II is correct"], answer: 2 },
            { question: "Consider the following:\n1. Cashew\n2. Papaya\n3. Red sanders\n\nHow many of the above trees are actually native to India?", options: ["Only one", "Only two", "All three", "None"], answer: 0 },
            { question: "Consider the following trees:\n1. Jackfruit (Artocarpus heterophyllus)\n2. Mahua (Madhuca indica)\n3. Teak (Tectona grandis)\n\nHow many of the above are deciduous trees?", options: ["Only one", "Only two", "All three", "None"], answer: 1 },
            { question: "Consider the following statements:\nStatement-I: Marsupials are not naturally found in India.\nStatement-II: Marsupials can thrive only in Montane grasslands with no predators.\n\nWhich of the following is correct in respect of the above statements?", options: ["Both Statement-I and Statement-II are correct and Statement-II is the correct explanation for Statement-I", "Both Statement-I and Statement-II are correct and Statement-II is not the correct explanation for Statement-I", "Statement-I is correct but Statement-II is incorrect", "Statement-I is incorrect but Statement-II is correct"], answer: 2 },
            { question: "Consider the following Fauna:\n1. Lion-tailed Macaque\n2. Malabar Civet\n3. Sambar Deer\n\nHow many of the above are generally nocturnal or most active after sunset?", options: ["Only one", "Only two", "All three", "None"], answer: 0 },
            { question: "Consider the following statements regarding the Indian squirrels:\n1. They build nests by making burrows in the ground.\n2. They store their food materials like nuts and seeds in the ground.\n3. They are omnivorous.\n\nHow many of the above statements are correct?", options: ["Only one", "Only two", "All three", "None"], answer: 1 },

            { question: "Which of the following is not a bird?", options: ["Golden Mahseer", "Indian Nightjar", "Spoonbill", "White Ibis"], answer: 0 },

            { question: "With reference to India's biodiversity, Ceylon frogmouth, Coppersmith barbet, Gray-chinned minivet and White-throated redstart are:", options: ["Birds", "Primates", "Reptiles", "Amphibians"], answer: 0 },

            // --- BATCH 4: Environment / Pollution (12 Questions) ---
            { question: "With reference to Perfluoroalkyl and polyfluoroalkyl substances (PFAS) that are used in making many consumer products, consider the following statements:\n1. PFAS are found to be widespread in drinking water, food and food packaging materials.\n2. PFAS are not easily degraded in the environment.\n3. Persistent exposure to PFAS can lead to bioaccumulation in animal bodies.\n\nWhich of the statements given above are correct?", options: ["1 and 2 only", "2 and 3 only", "1 and 3 only", "1, 2 and 3"], answer: 3 },
            { question: "Consider the following statements:\nStatement I: Many chewing gums found in the market are considered a source of environmental pollution.\nStatement-II: Many chewing gums contain plastic as gum base.\n\nWhich one of the following is correct in respect of the above statements?", options: ["Statement-I and Statement-II are correct and Statement-II explains Statement-I", "Both Statement-I and Statement-II are correct, but Statement-II does not explain Statement-I", "Statement-I is correct, but Statement-II is incorrect", "Statement-I is incorrect, but Statement-II is correct"], answer: 0 },
            { question: "According to the Environmental Protection Agency (EPA), which one of the following is the largest source of sulphur dioxide emissions?", options: ["Locomotives using fossil fuels", "Ships using fossil fuels", "Extraction of metals from ores", "Power plants using fossil fuels"], answer: 3 },
            { question: "\"Membrane Bioreactors\" are often discussed in the context of:", options: ["Assisted reproductive technologies", "Drug delivery nanotechnologies", "Vaccine production technologies", "Wastewater treatment technologies"], answer: 3 },

            { question: "Consider the following:\n1. Carbon monoxide\n2. Nitrogen oxide\n3. Ozone\n4. Sulphur dioxide\n\nExcess of which of the above in the environment is/are the cause(s) of acid rain?", options: ["1, 2 and 3", "2 and 4 only", "4 only", "1, 3 and 4"], answer: 1 },
            { question: "In the context of WHO Air Quality Guidelines, consider the following statements:\n1. The 24-hour mean of PM 2.5 should not exceed 15 µg/m3 and annual mean of PM2.5 should not exceed 5µg/m3.\n2. In a year, the highest levels of ozone pollution occur during the periods of inclement weather.\n3. PM 10 can penetrate the lung barrier and enter the bloodstream.\n4. Excessive ozone in the air can trigger asthma.\n\nWhich of the statements given above are correct?", options: ["1, 3 and 4", "1 and 4 only", "2, 3 and 4", "1 and 2 only"], answer: 1 },

            { question: "'R2 Code of Practices' constitutes a tool available for promoting the adoption of:", options: ["Environmentally responsible practices in electronics recycling industry", "Ecological management of 'Wetlands of International Importance' under the Ramsar", "Sustainable practices in the cultivation of agricultural crops in degrade lands", "'Environmental Impact Assessment' in the exploitation of natural resources"], answer: 0 },

            // --- BATCH 5: Astronomy (6 Questions) ---
            { question: "Consider the following statements:\nStatement I: Giant stars live much longer than dwarf stars.\nStatement-II: Compared to dwarf stars, giant stars have greater rate of nuclear reactions.\n\nWhich one of the following is correct in respect of the above statements?", options: ["Statement-I and Statement-II are correct and Statement-II explains Statement-I", "Both Statement-I and Statement-II are correct, but Statement-II does not explain Statement-I", "Statement-I is correct, but Statement-II is incorrect", "Statement-I is incorrect, but Statement-II is correct"], answer: 3 },

            { question: "Bollgard I and Bollgard II technologies are mentioned in the context of:", options: ["Clonal propagation of crop plants", "Developing genetically modified crop plants", "Production of plant growth substances", "Production of biofertilizers"], answer: 1 },

        ];

        // Shuffle the questions array so they are jumbled
        for (let i = questions.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));

        }

        // ---------------------------------------------------------

        let currentQuestionIndex = 0;

        const optionsContainer = document.getElementById("options-container");

        function loadQuestion() {
            if (currentQuestionIndex >= questions.length) {
                questionText.innerText = "Daily Goal Completed! 🎉";
                optionsContainer.innerHTML = `<p style='text-align:center; font-size: 1.2em;'>Your Final Score: ${score} / ${questions.length}</p>`;
                nextBtn.style.display = "none";
                scoreDisplay.style.display = "none";
                return;
            }

            const q = questions[currentQuestionIndex];
            
            questionText.innerText = (currentQuestionIndex + 1) + ". " + q.question;
            
            optionsContainer.innerHTML = "";
            nextBtn.disabled = true; 

            q.options.forEach((option, index) => {
                const button = document.createElement("button");
                button.innerText = option;
                button.classList.add("option-btn");
                button.onclick = () => checkAnswer(index, q.answer, button);
                optionsContainer.appendChild(button);
            });
            
            scoreDisplay.innerText = `Score: ${score} / ${questions.length}`;
        }

        function checkAnswer(selectedIndex, correctIndex, button) {
            const buttons = optionsContainer.getElementsByClassName("option-btn");
            
            for(let btn of buttons) {
                btn.disabled = true;
                btn.style.cursor = "default";
            }

            if (selectedIndex === correctIndex) {
                button.classList.add("correct");
                score++;
            } else {
                button.classList.add("wrong");
                buttons[correctIndex].classList.add("correct");
            }

            nextBtn.disabled = false;
        }

        function nextQuestion() {
            currentQuestionIndex++;
            loadQuestion();
        }

        document.getElementById("date-display").innerText = new Date().toDateString();
        loadQuestion();
    </script>
</body>
</html>
