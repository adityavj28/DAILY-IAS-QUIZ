<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily IAS Prep</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background-color: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 600px; width: 100%; }
        h1 { text-align: center; color: #333; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 25px; font-size: 0.9em; }
        .question-box { font-size: 1.1em; margin-bottom: 20px; font-weight: 600; color: #2c3e50; line-height: 1.5; white-space: pre-line; }
        .options-list { list-style-type: none; padding: 0; }
        .option-btn { display: block; width: 100%; padding: 12px; margin-bottom: 10px; background-color: #e9ecef; border: 1px solid #ddd; border-radius: 5px; text-align: left; cursor: pointer; font-size: 0.95em; transition: background 0.2s; line-height: 1.4; }
        .option-btn:hover { background-color: #dbe2e8; }
        .correct { background-color: #d4edda !important; border-color: #c3e6cb !important; color: #155724; }
        .wrong { background-color: #f8d7da !important; border-color: #f5c6cb !important; color: #721c24; }
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 20px; border-top: 1px solid #eee; padding-top: 20px; }
        .btn { padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 1em; }
        .btn:disabled { background-color: #ccc; cursor: not-allowed; }
        #score-display { font-weight: bold; color: #555; align-self: center; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Daily IAS Prep</h1>
        <p class="subtitle" id="date-display">Date: Loading...</p>

        <div id="quiz-area">
            <div class="question-box" id="question-text">Loading question...</div>
            <div class="options-list" id="options-container"></div>
        </div>

        <div class="nav-buttons">
            <span id="score-display">Score: 0 / 0</span>
            <button class="btn" id="next-btn" onclick="nextQuestion()">Next Question</button>
        </div>
    </div>

    <script>
        // ---------------------------------------------------------
        // LATEST BATCH QUESTIONS (JUMBLED) - 52 QUESTIONS
        // ---------------------------------------------------------
        const questions = [
            {

                options: ["1 and 2", "2 and 3", "3 and 4", "1 and 4"],
                answer: 1
            },
            {
                question: "With reference to ancient India, consider the following statements:\n1. The concept of Stupa is Buddhist in origin.\n2. Stupa was generally a repository of relics.\n3. Stupa was a votive and commemorative structure in Buddhist tradition.\n\nHow many of the statements given above are correct?",
                options: ["Only one", "Only two", "All three", "None"],
                answer: 1
            },
            {
                question: "With reference to the Indian History, Alexander Rea, A.H. Longhurst, Robert Sewell, James Burgess and Walter Elliot were associated with?",
                options: ["Archaeological excavations", "Establishment of English Press in Colonial India", "Establishment of Churches in Princely States", "Construction of railways in Colonial India"],
                answer: 0
            },
            {

                options: ["Only one pair", "Only two pairs", "Only three pairs", "All four pairs"],
                answer: 1
            },
            {
                question: "Consider the following pairs:\nSite : Well known for\n1. Besnagar : Shaivite cave shrine\n2. Bhaja : Buddhist cave shrine\n3. Sittanavasal : Jain cave shrine\n\nHow many of the above pairs are correctly matched?",
                options: ["Only one", "Only two", "All three", "None"],

            {
                question: "The Prime Minister recently inaugurated the new Circuit House near Somnath Temple at Veraval. Which of the following statements are correct regarding Somnath Temple?\n1. Somnath Temple is one of the Jyotirlinga shrines.\n2. A description of Somnath Temple was given by Al-Biruni.\n3. Pran Pratishtha of Somnath Temple (installation of the present day temple) was done by President S. Radhakrishnan.\n\nSelect the correct answer using the code given below:",
                options: ["1 and 2 only", "2 and 3 only", "1 and 3 only", "1, 2 and 3"],

            {

                options: ["1 only", "2 and 3 only", "1 and 3 only", "1, 2 and 3"],
                answer: 0

                answer: 0

                options: ["1 and 2", "2 and 3 only", "1 and 4", "2, 3 and 4"],

            {

                options: ["1 and 2 only", "3 only", "1 and 3 only", "None is correct"],

                options: ["Georg Bilhler", "James Prinsep", "Max Muller", "William Jones"],

            {

                answer: 0

            {

                options: ["Kanganahalli", "Sanchi", "Shahbazagrhi", "Sohgaura"],
                answer: 0

            {

                options: ["Lingaraja Temple at Bhubaneswar", "Rock-cut Elephant at Dhauli", "Rock-cut Monuments at Mahabalipuram", "Varaha Image at Udayagiri"],
                answer: 1

            {

                options: ["Kavyalankara", "Natyashastra", "Madhyama-vyayoga", "Mahabhashya"],
                answer: 2
            },
            {
                question: "Consider the following statements:\n1. There are no parables in Upanishads.\n2. Upanishads were composed earlier than the Puranas.\n\nWhich of the statements given above is/are correct?",
                options: ["1 only", "2 only", "Both 1 and 2", "Neither 1 nor 2"],
                answer: 1
            },
            {
                question: "Sanghabhuti, an Indian Buddhist monk, who travelled to China at the end of the fourth century AD, was the author of a commentary on:",
                options: ["Prajnaparamita Sutra", "Visuddhimagga", "Sarvastivada Vinaya", "Lalitavistara"],
                answer: 2
            },
            {
                question: "Which one of the following statements about Sangam literature in ancient South India is correct?",
                options: ["Sangam poems are devoid of any reference to material culture.", "The social classification of Varna was known to Sangam poets.", "Sangam poems have no references to warrior ethic.", "Sangam literature refers to magical forces as irrational."],
                answer: 1
            },
            {
                question: "Which one of the following explains the practice of ‘Vattakirutal’ as mentioned in the Sangam poems?",
                options: ["Kings employing women bodyguards", "Learned persons assembling in royal courts to discuss religious and philosophical matters.", "Young girls keeping watch over agricultural fields and driving away birds and animals.", "A king defeated in a battle committing ritual suicide by starving himself to death."],
                answer: 3
            },
            {
                question: "With reference to the history of ancient India Bhavabhuti Hastimalla and Kshemeshvara were famous:",
                options: ["Jain monks", "Playwrights", "Temple architects", "Philosophers"],
                answer: 1
            },
            {
                question: "With reference to ancient Indian History, consider the following pairs:\nLiterary Work : Author\n1. Devichandragupta : Bilhana\n2. Hammira-Mahakavya : Nayachandra Suri\n3. Milinda-panha : Nagarjuna\n4. Nitivakyamrita : Somadeva Suri\n\nHow many of the above pairs are correctly matched?",
                options: ["Only one", "Only two", "Only three", "All four"],
                answer: 1
            },
            {
                question: "With reference to the scholars/litterateurs of ancient India, consider the following statements:\n1. Panini is associated with Pushyamitra\n2. Amarasimha is associated with Harshavardhan\n3. Kalidasa is associated with Chandra Gupta-II\n\nWhich of the statements given above is/are correct?",
                options: ["1 and 2 only", "2 and 3 only", "3 only", "1, 2 and 3"],
                answer: 2
            },
            {
                question: "With reference to Union Budget, consider the following statements:\n1. The Union Finance Minister on behalf of the Prime Minister lays the Annual Financial Statement before both the Houses of Parliament.\n2. At the Union level, no demand for a grant can be made except on the recommendation of the President of India.\n\nWhich of the statements given above is/are correct?",
                options: ["1 only", "2 only", "Both 1 and 2", "Neither 1 nor 2"],
                answer: 1
            },
            {
                question: "In the context of the Indian economy, non-financial debt includes which of the following?\n1. Housing loans owed by households\n2. Amounts outstanding on credit cards\n3. Treasury bills\n\nSelect the correct answer using the code given below:",
                options: ["1 only", "1 and 2 only", "3 only", "1, 2 and 3"],
                answer: 3
            },
            {
                question: "Consider the following statements:\n1. Most of India’s external debt is owed by governmental entities.\n2. All of India’s external debt is denominated in US dollars.\n\nWhich of the statements given above is/are correct?",
                options: ["1 only", "2 only", "Both 1 and 2", "Neither 1 nor 2"],
                answer: 3
            },
            {
                question: "With reference to the Indian economy, consider the following statements:\n1. A share of the household financial savings goes towards government borrowings.\n2. Dated securities issued at market-related rates in auctions form a large component of internal debt.\n\nWhich of the above statements is/are correct?",
                options: ["1 only", "2 only", "Both 1 and 2", "Neither 1 nor 2"],
                answer: 2
            },
            {
                question: "Along with the Budget, the Finance Minister also places other documents before the Parliament which include ‘The Macro Economic Framework Statement’. The aforesaid document is presented because this is mandated by:",
                options: ["Long standing parliamentary convention", "Article 112 and Article 110(1) of the Constitution of India", "Article 113 of the Constitution of India", "Provisions of the Fiscal Responsibility and Budget Management Act, 2003"],
                answer: 3
            },
            {
                question: "Consider the following activities:\n1. Identification of narcotics on passengers at airports or in aircraft\n2. Monitoring of precipitation\n3. Tracking the migration of animals\n\nIn how many of the above activities can the radars be used?",
                options: ["Only one", "Only two", "All three", "None"],
                answer: 2
            },
            {
                question: "With reference to Non-Fungible Tokens (NFTs), consider the following:\n1. They enable the digital representation of physical assets.\n2. They are unique cryptographic tokens that exist on a blockchain.\n3. They can be traded or exchanged at equivalency and therefore can be used as a medium of commercial transactions.\n\nWhich of the statements given above are correct?",
                options: ["1 and 2 only", "2 and 3 only", "1 and 3 only", "1, 2 and 3"],
                answer: 0
            },
            {
                question: "Which one of the following words/phrases is most appropriately used to denote 'an interoperable network of 3D virtual worlds that can be accessed simultaneously by millions of users, who can exert property rights over virtual items'?",
                options: ["Big data analytics", "Cryptography", "Metaverse", "Virtual matrix"],
                answer: 2
            },
            {
                question: "Consider the following:\n1. Aarogya Setu\n2. CoWIN\n3. DigiLocker\n4. DIKSHA\n\nWhich of the above are built on top of open-source digital platforms?",
                options: ["1 and 2 only", "2, 3 and 4 only", "1, 3 and 4 only", "1, 2, 3 and 4"],
                answer: 3
            },
            {
                question: "Consider the following actions:\n1. Detection of car crash/collision which results in the deployment of airbags almost instantaneously\n2. Detection of accidental free fall of a laptop towards the ground which results in the immediate turning off of the hard drive\n3. Detection of the tilt of the smart- phone which results in the rotation of display between portrait and landscape mode\n\nIn how many of the above actions is the function of accelerometer required?",
                options: ["Only one", "Only two", "All three", "None"],
                answer: 2
            },
            {
                question: "With reference to Web 3.0, consider the following statements:\n1. Web 3.0 technology enables people to control their own data.\n2. In the Web 3.0 world, there can be blockchain based social networks.\n3. Web 3.0 is operated by users collectively rather than a corporation.\n\nWhich of the statements given are correct?",
                options: ["1 and 2 only", "2 and 3 only", "1 and 3 only", "1, 2 and 3"],
                answer: 3
            },
            {
                question: "With reference to “Software as a Service (SaaS)”, consider the following statements:\n1. SaaS buyers can customise the user interface and can change data fields.\n2. SaaS users can access their data through their mobile devices.\n3. Outlook, Hotmail and Yahoo! Mail are forms of SaaS.\n\nWhich of the statements given above are correct?",
                options: ["1 and 2 only", "2 and 3 only", "1 and 3 only", "1, 2 and 3"],
                answer: 3
            },
            {
                question: "Consider the following communication technologies:\n1. Closed-circuit Television\n2. Radio Frequency Identification\n3. Wireless Local Area Network\n\nWhich, of the above are considered Short-Range devices/technologies?",
                options: ["1 and 2 only", "2 and 3 only", "1 and 3 only", "1, 2 and 3"],
                answer: 3
            },
            {
                question: "With reference to Visible Light Communication (VLC) technology, which of the following statements are correct?\n1. VLC uses electromagnetic spectrum wavelengths 375 to 780 nm.\n2. VLC is known as long-range optical wireless communication.\n3. VLC can transmit large amounts of data faster than Bluetooth.\n4. VLC has no electromagnetic interference.\n\nSelect the correct answer using the code given below:",
                options: ["1, 2 & 3 only", "1, 2 & 4 only", "1, 3 & 4 only", "2, 3 & 4 only"],
                answer: 2
            },
            {
                question: "Consider the following activities:\n1. Spraying pesticides on a crop field\n2. Inspecting the craters of active volcanoes\n3. Collecting breath samples from spouting whales for DNA analysis\n\nAt the present level of technology, which of the above activities can be successfully carried out by using drones?",
                options: ["1 and 2 only", "2 and 3 only", "1 and 3 only", "1, 2 and 3"],
                answer: 3
            },
            {
                question: "With reference to “Blockchain Technology”, consider the following statements:\n1. It is a public ledger that everyone can inspect, but which no single user controls.\n2. The structure and design of blockchain is such that all the data in it are about cryptocurrency only.\n3. Applications that depend on basic features of blockchain can be developed without anybody’s permission.\n\nWhich of the statements given above is/are correct?",
                options: ["1 only", "1 and 2 only", "2 only", "1 and 3 only"],
                answer: 3
            },
            {
                question: "With the present state of development, Artificial Intelligence can effectively do which of the following?\n1. Bring down electricity consumption in industrial units\n2. Create meaningful short stories and songs\n3. Disease diagnosis\n4. Text-to-Speech Conversion\n5. Wireless transmission of electrical energy\n\nSelect the correct answer using the code given below:",
                options: ["1, 2, 3 & 5 only", "1, 3 & 4 only", "2, 4 & 5 only", "1, 2, 3, 4 & 5"],
                answer: 1
            },
            {
                question: "Consider the following statements:\nStatement I: Giant stars live much longer than dwarf stars.\nStatement-II: Compared to dwarf stars, giant stars have greater rate of nuclear reactions.\n\nWhich one of the following is correct in respect of the above statements?",
                options: ["Statement-I and Statement-II are correct and Statement-II explains Statement-I", "Both Statement-I and Statement-II are correct, but Statement-II does not explain Statement-I", "Statement-I is correct, but Statement-II is incorrect", "Statement-I is incorrect, but Statement-II is correct"],
                answer: 3
            },
            {
                question: "If a major solar storm (solar-flare) reaches the Earth, which of the following are the possible effects on the Earth?\n1. GPS and navigation systems could fail.\n2. Tsunamis could occur at equatorial regions.\n3. Power grids could be damaged.\n4. Intense auroras ‘could occur over much of the Earth.\n5. Forest fires could take place over much of the planet.\n6. Orbits of the satellites could be disturbed.\n7. Shortwave radio communication of the aircraft flying over polar regions could be interrupted.\n\nSelect the correct answer using the code give-n below:",
                options: ["1, 2, 4 and 5 only", "2, 3, 5, 6 and 7 only", "1, 3, 4, 6 and 7 only", "1, 2, 3, 4, 5, 6 and 7"],
                answer: 2
            },
            {
                question: "Consider the following pairs:\nObjects in space : Description\n1. Cepheids : Giant clouds of dust and gas in space\n2. Nebulae : Stars which brighten and dim periodically\n3. Pulsars : Neutron stars that are formed when massive stars run out of fuel and collapse\n\nHow many of the above pairs are correctly matched?",
                options: ["Only one", "Only two", "All three", "None"],
                answer: 0
            },
            {
                question: "Which one of the following countries has its own Satellite Navigation System?",
                options: ["Australia", "Canada", "Israel", "Japan"],
                answer: 3
            },
            {
                question: "Which one of the following statements best reflects the idea behind the “Fractional Orbital Bombardment System” often talked about in the media?",
                options: ["A hypersonic missile is launched into space to counter the asteroid approaching the Earth and explode it in space.", "A spacecraft lands on another planet after making several orbital motions.", "A missile is put into a stable orbit around the Earth and deorbits over a target on the Earth.", "A spacecraft moves along a comet with the same speed and places a probe on its surface"],
                answer: 2
            },
            {
                question: "Which one of the following is a reason why astronomical distances are measured in light-years?",
                options: ["Distances among stellar bodies do not change", "Gravity of stellar bodies does not change", "Light always travels in straight line", "Speed of light is always same"],
                answer: 3
            },
            {
                question: "In which of the following area can GPS technology be used?\n1. Mobile phones operation\n2. Banking operations\n3. Controlling the power grids\n\nWhich of the pairs given above is/are correct?",
                options: ["1 only", "2 and 3 only", "1 and 3 only", "1, 2 and 3"],
                answer: 3
            },
            {
                question: "“The experiment will employ a trio of spacecraft flying in formation in the shape of an equilateral triangle that has sides one million kilometres long, with lasers shining between the craft.” The experiment in question refers to:",
                options: ["Voyager-2", "New horizons", "Lisa Pathfinder", "Evolved LISA"],
                answer: 3
            },
            {
                question: "Consider the following statements:\n1. The Earth’s magnetic fields has reserved every few hundred thousand years.\n2. When the Earth was created more than 4000 million years ago, there was 54% oxygen and no carbon dioxide.\n3. When living organism originated, they modified the early atmosphere of the Earth.\n\nWhich of the statements given above is/are correct?",
                options: ["1 only", "2 and 3 only", "1 and 3 only", "1, 2 and 3"],
                answer: 2
            },
            {
                question: "Recently, Scientists observed the merger of giant blackholes’ billions of light-years away from the Earth. What is the significance of this observation?",
                options: ["'Higgs boson particles' were detected.", "'Gravitational waves' were detected.", "Possibility of inter-galactic space travel through 'wormhole' was confirmed.", "It enabled the scientists to understand 'singularity'."],
                answer: 1
            },
            {
                question: "For the measurement/estimation of which of the following are satellite images/remote sensing data used?\n1. Chlorophyll content in the vegetation of a specific location\n2. Greenhouse gas emissions from rice paddies of a specific location\n3. Land surface temperatures of a specific location\n\nSelect the correct answer using the code given below.",
                options: ["1 Only", "2 and 3 only", "3 only", "1, 2 and 3"],
                answer: 3
            }
        ];

        // Shuffle the questions array so they are jumbled
        for (let i = questions.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [questions[i], questions[j]] = [questions[j], questions[i]];
        }

        // ---------------------------------------------------------

        let currentQuestionIndex = 0;
        let score = 0;
        const questionText = document.getElementById("question-text");
        const optionsContainer = document.getElementById("options-container");
        const scoreDisplay = document.getElementById("score-display");
        const nextBtn = document.getElementById("next-btn");

        function loadQuestion() {
            if (currentQuestionIndex >= questions.length) {
                questionText.innerText = "Daily Goal Completed! 🎉";
                optionsContainer.innerHTML = `<p style='text-align:center; font-size: 1.2em;'>Your Final Score: ${score} / ${questions.length}</p>`;
                nextBtn.style.display = "none";
                scoreDisplay.style.display = "none";
                return;
            }

            const q = questions[currentQuestionIndex];
            
            questionText.innerText = (currentQuestionIndex + 1) + ". " + q.question;
            
            optionsContainer.innerHTML = "";
            nextBtn.disabled = true; 

            q.options.forEach((option, index) => {
                const button = document.createElement("button");
                button.innerText = option;
                button.classList.add("option-btn");
                button.onclick = () => checkAnswer(index, q.answer, button);
                optionsContainer.appendChild(button);
            });
            
            scoreDisplay.innerText = `Score: ${score} / ${questions.length}`;
        }

        function checkAnswer(selectedIndex, correctIndex, button) {
            const buttons = optionsContainer.getElementsByClassName("option-btn");
            
            for(let btn of buttons) {
                btn.disabled = true;
                btn.style.cursor = "default";
            }

            if (selectedIndex === correctIndex) {
                button.classList.add("correct");
                score++;
            } else {
                button.classList.add("wrong");
                buttons[correctIndex].classList.add("correct");
            }

            nextBtn.disabled = false;
        }

        function nextQuestion() {
            currentQuestionIndex++;
            loadQuestion();
        }

        document.getElementById("date-display").innerText = new Date().toDateString();
        loadQuestion();
    </script>
</body>
</html>
