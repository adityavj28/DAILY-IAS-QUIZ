<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily IAS Prep</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background-color: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 600px; width: 100%; }
        h1 { text-align: center; color: #333; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 25px; font-size: 0.9em; }
        .question-box { font-size: 1.1em; margin-bottom: 20px; font-weight: 600; color: #2c3e50; line-height: 1.5; white-space: pre-line; }
        .options-list { list-style-type: none; padding: 0; }
        .option-btn { display: block; width: 100%; padding: 12px; margin-bottom: 10px; background-color: #e9ecef; border: 1px solid #ddd; border-radius: 5px; text-align: left; cursor: pointer; font-size: 0.95em; transition: background 0.2s; line-height: 1.4; }
        .option-btn:hover { background-color: #dbe2e8; }
        .correct { background-color: #d4edda !important; border-color: #c3e6cb !important; color: #155724; }
        .wrong { background-color: #f8d7da !important; border-color: #f5c6cb !important; color: #721c24; }
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 20px; border-top: 1px solid #eee; padding-top: 20px; }
        .btn { padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 1em; }
        .btn:disabled { background-color: #ccc; cursor: not-allowed; }
        #score-display { font-weight: bold; color: #555; align-self: center; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Daily IAS Prep</h1>
        <p class="subtitle" id="date-display">Date: Loading...</p>

        <div id="quiz-area">
            <div class="question-box" id="question-text">Loading question...</div>
            <div class="options-list" id="options-container"></div>
        </div>

        <div class="nav-buttons">
            <span id="score-display">Score: 0 / 0</span>
            <button class="btn" id="next-btn" onclick="nextQuestion()">Next Question</button>
        </div>
    </div>

    <script>
        // ---------------------------------------------------------
        // LATEST BATCH QUESTIONS (JUMBLED) - 38 QUESTIONS
        // ---------------------------------------------------------
        const questions = [
            {
                question: "With reference to ancient India, Gautama Buddha was generally known by which of the following epithets?\n1. Nayaputta\n2. Shakyamuni\n3. Tathagata\n\nSelect the correct answer using the code given below:",
                options: ["1 only", "2 and 3 only", "1, 2 and 3", "None of the above are epithets of Gautama Buddha"],
                answer: 1
            },
            {
                question: "With reference to Indian history, consider the following texts:\n1. Nettipakarana\n2. Parishishtaparvan\n3. Avadanashataka\n4. Trishashtilakshana Mahapurana\n\nWhich of the above are Jaina texts?",
                options: ["1, 2 and 3", "2 and 4 only", "1, 3 and 4", "2, 3 and 4"],
                answer: 1
            },
            {
                question: "“Souls are not only the property of animal and plant life, but also of rocks, running water and many other natural objects not looked on as living by other religious sects.”\n\nThe above statement reflects one of the core beliefs of which one of the following religious sects of ancient India?",
                options: ["Buddhism", "Jainism", "Shaivism", "Vaishnavism"],
                answer: 1
            },
            {
                question: "With reference to Indian history, consider the following pairs:\nHistorical person : Known as\n1. Aryadeva : Jaina Scholar\n2. Dignaga : Buddhist Scholar\n3. Nathamuni : Vaishnava scholar\n\nHow many pairs given above are correctly matched?",
                options: ["None of the pairs", "Only one pair", "Only two pairs", "All three pairs"],
                answer: 2
            },
            {
                question: "In which one of the following regions was Dhanyakataka, which flourished as a prominent Buddhist center under the Mahasanghikas, located?",
                options: ["Andhra", "Gandhara", "Kalinga", "Magadha"],
                answer: 0
            },
            {
                question: "The world’s second tallest statue in sitting pose of Ramanuja was inaugurated by the Prime Minister of India at Hyderabad recently. Which one of the following statements correctly represents the teachings of Ramanuja?",
                options: ["The best means of salvation was devotion.", "Vedas are eternal, self-existent and wholly authoritative.", "Logical arguments were essential means for the highest bliss.", "Salvation was to be obtained through meditation."],
                answer: 0
            },
            {
                question: "With reference to the history of ancient India, which of the following statements is/are correct?\n1. Mitakshara was the civil law for upper castes and Dayabhaga was the civil law for lower castes.\n2. In the Mitakshara system, the sons can claim right to the property during the lifetime of the father, whereas in the Dayabhaga system, it is only after the death of the father that the sons can claim right to the property.\n3. The Mitakshara system deals with the matters related to the property held by male members only of a family, whereas the Dayabhaga system deals with the matters related to the property held by both male and female members of a family.\n\nSelect the correct answer using the code given below.",
                options: ["1 and 2", "2 only", "1 and 3", "3 only"],
                answer: 1
            },
            {
                question: "With reference to revenue collection by Cornwallis, consider the following statements:\n1. Under the Ryotwari Settlement of revenue collection, the peasants were exempted from revenue payment in case of bad harvests or natural calamities.\n2. Under the Permanent Settlement in Bengal, if the Zamindar failed to pay his revenues to the state, on or before the fixed date, he would be removed from his Zamindari.\n\nWhich of the statements given above is/are correct?",
                options: ["1 only", "2 only", "Both 1 and 2", "Neither 1 nor 2"],
                answer: 1
            },
            {
                question: "By which one of the following Acts was the Governor General of Bengal designated as the Governor General of India?",
                options: ["The Regulating Act", "The Pitt’s India Act", "The Charter Act of 1793", "The Charter Act of 1833"],
                answer: 3
            },
            {
                question: "Consider the following statements about ‘the Charter Act of 1813’:\n1. It ended the trade monopoly of the East India Company in India except for trade in tea and trade with China.\n2. It asserted the sovereignty of the British Crown over the Indian territories held by the Company.\n3. The revenues of India were now controlled by the British Parliament.\n\nWhich of the statements given above are correct?",
                options: ["1 and 2 only", "2 and 3 only", "1 and 3 only", "1, 2 and 3"],
                answer: 0
            },
            {
                question: "With reference to Indian history, which of the following statements is/are correct?\n1) The Nizamat of Arcot emerged out of Hyderabad State.\n2) The Mysore Kingdom emerged out of Vijayanagara Empire.\n3) Rohilkhand Kingdom was formed out of the territories occupied by Ahmad Shah Durrani.\n\nSelect the correct answer using the code given below.",
                options: ["1 and 2", "2 only", "2 and 3", "3 only"],
                answer: 0
            },
            {
                question: "Which of the following statements correctly explains the impact of the Industrial Revolution on India during the first half of the nineteenth century?",
                options: ["Indian handicrafts were ruined.", "Machines were introduced in the Indian textile industry in large numbers.", "Railways lines were laid in many parts of the country.", "Heavy duties were imposed on the imports of British manufactures."],
                answer: 0
            },
            {
                question: "Which of the following activities of Reserve Bank of India is considered to be part of ‘Sterilization’?",
                options: ["Conducting ‘Open Market Operations’", "Oversight of settlement and payment systems", "Debt and cash management for Central and State Governments", "Regulating the functions of Non-banking Financial Institutions"],
                answer: 0
            },
            {
                question: "In India, which one of the following is responsible for maintaining price stability by controlling inflation?",
                options: ["Department of Consumer Affairs", "Expenditure Management Commission", "Financial Stability and Development Council", "Reserve Bank of India"],
                answer: 3
            },
            {
                question: "With reference to the Indian economy, consider the following statements:\n1. If the inflation is too high, Reserve Bank of India (RBI) is likely to buy government securities.\n2. If the rupee is rapidly depreciating, RBI is likely to sell dollars in the market.\n3. If interest rates in the USA or European Union were to fall, that is likely to induce RBI to buy dollars.\n\nWhich of the statements given above are correct?",
                options: ["1 and 2 only", "2 and 3 only", "1 and 3 only", "1, 2 and 3"],
                answer: 1
            },
            {
                question: "Consider the following statements:\n1. Tight monetary policy of US Federal Reserve could lead to capital flight\n2. Capital flight may increase the interest cost of firms with existing External Commercial Borrowings (ECBs).\n3. Devaluation of domestic currency decreases the currency risk associated with ECBs.\n\nWhich of the statements is correct?",
                options: ["1 and 2 only", "2 and 3 only", "1 and 3 only", "1, 2 and 3"],
                answer: 0
            },
            {
                question: "With reference to the Indian economy, consider the following statements:\n1. An increase in Nominal Effective Exchange Rate (NEER) indicates the appreciation of rupee.\n2. An increase in the Real Effective Exchange Rate (REER) indicates an improvement in trade competitiveness.\n3. An increasing trend in domestic inflation relative to inflation in other countries is likely to cause an increasing divergence between NEER and REER.\n\nWhich of the above statements are correct?",
                options: ["1 and 2 only", "2 and 3 only", "1 and 3 only", "1, 2 and 3"],
                answer: 2
            },
            {
                question: "Consider the following statements:\nThe effect of devaluation of a currency is that it necessarily\n1) Improves the competitiveness of the domestic exports in the foreign markets\n2) Increases the foreign value of domestic currency\n3) Improves the trade balance\n\nWhich of the above statement is/are correct?",
                options: ["1 only", "1 and 2", "3 only", "2 and 3"],
                answer: 0
            },
            {
                question: "Which one of the following is likely to be the most inflationary in its effects?",
                options: ["Repayment of public debt", "Borrowing from the public to finance a budget deficit", "Borrowing from the banks to finance a budget deficit", "Creation of new money to finance a budget deficit"],
                answer: 3
            },
            {
                question: "In the context of India, which of the following factors is/are contributor/contributors to reducing the risk of a currency crisis?\n1. The foreign currency earnings of India's IT sector\n2. Increasing the government expenditure\n3. Remittances from Indians abroad\n\nSelect the correct answer using the code given below:",
                options: ["1 only", "1 and 3 only", "2 only", "1, 2 and 3"],
                answer: 1
            },
            {
                question: "The money multiplier in an economy increases with which one of the following?",
                options: ["Increase in the cash Reserve Ration in the banks", "Increase in the Statutory Liquidity Ratio in the banks", "Increase in the banking habit of the people", "Increase in the population of the country"],
                answer: 2
            },
            {
                question: "With reference to Indian economy, demand-pull inflation can be caused/increased by which of the following?\n1) Expansionary policies\n2) Fiscal stimulus\n3) Inflation-indexing wages\n4) Higher purchasing power\n5) Rising interest rates\n\nSelect the correct answer using the code given below.",
                options: ["1, 2 and 4 only", "3, 4 and 5 only", "1, 2, 3 and 5 only", "1, 2, 3, 4 and 5"],
                answer: 0
            },
            {
                question: "If another global financial crisis happens in the near future, which of the following actions/policies are most likely to give some immunity to India?\n1. Not depending on short-term foreign borrowings\n2. Opening up to more foreign banks\n3. Maintaining full capital account convertibility\n\nSelect the correct answer using the code given below:",
                options: ["1 only", "1 and 2 only", "3 only", "1, 2 and 3"],
                answer: 0
            },
            {
                question: "If you withdraw ₹1,00,000 in cash from your Demand Deposit Account at your bank, the immediate effect on aggregate money supply in the economy will be:",
                options: ["To reduce it by ₹1,00,000", "To increase it by ₹1,00,000", "To increase it by more than ₹1,00,000", "To leave it unchanged"],
                answer: 3
            },
            {
                question: "With reference to the rule/rules imposed by the Reserve Bank of India while treating foreign banks, consider the following statements:\n1. There is no minimum capital requirement for wholly owned banking subsidiaries in India.\n2. For wholly owned banking subsidiaries in India, at least 50% of the board members should be Indian nationals.\n\nWhich of the statements given above is/are correct?",
                options: ["1 only", "2 only", "1 and 2", "neither 1 nor 2"],
                answer: 1
            },
            {
                question: "Consider the following statements:\nStatement I: Syndicated lending spreads the risk of borrower default across multiple lenders.\nStatement-II: The syndicated loan can be a fixed amount/lump sum of funds, but cannot be a credit line.\n\nWhich one of the following is correct in respect of the above statements?",
                options: ["Statement-I and Statement-II are correct and Statement-II explains Statement-I", "Both Statement-I and Statement-II are correct, but Statement-II does not explain Statement-I", "Statement-I is correct, but Statement-II is incorrect", "Statement-I is incorrect, but Statement-II is correct"],
                answer: 2
            },
            {
                question: "Consider the following statements in respect of the digital rupee:\n1. It is a sovereign currency issued by the Reserve Bank of India (RBI) in alignment with its monetary policy.\n2. It appears as a liability on the RBI's balance sheet.\n3. It is insured against inflation by its very design.\n4. It is freely convertible against commercial bank money and cash.\n\nWhich of the statements given above are correct?",
                options: ["1 and 2 only", "1 and 3 only", "2 and 4 only", "1, 2 and 4"],
                answer: 3
            },
            {
                question: "Consider the following statements with reference to India:\n1. According to the 'Micro, Small and Medium Enterprises Development (MSMED) Act, 2006', the 'medium enterprises' are those with investments in plant and machinery between ₹15 crore and ₹25 crore.\n2. All bank loans to the Micro, Small and Medium Enterprises qualify under the priority sector.\n\nWhich of the statements given above is/are correct?",
                options: ["1 only", "2 only", "Both 1 and 2", "Neither 1 nor 2"],
                answer: 1
            },
            {
                question: "With reference to Central Bank digital currencies, consider the following statements:\n1. It is possible to make payments in a digital currency without using US dollar or SWIFT system.\n2. A digital currency can be distributed with a condition programmed into it such as a time-frame for spending it.\n\nWhich of the statements given above is/are correct?",
                options: ["1 only", "2 only", "Both 1 and 2", "Neither 1 nor 2"],
                answer: 2
            },
            {
                question: "Consider the following statements:\n1. The Self-Help Group (SHG) programme was originally initiated by the State Bank of India by providing microcredit to the financially deprived.\n2. In an SHG, all members of a group take responsibility for a loan that an individual member takes.\n3. The Regional Rural Banks and Scheduled Commercial Banks support SHGs.\n\nHow many of the above statements are correct?",
                options: ["Only one", "Only two", "All three", "None"],
                answer: 1
            },
            {
                question: "Consider the following statements:\n1. In India, credit rating agencies are regulated by the Reserve Bank of India.\n2. The rating agency popularly known as ICRA is a public limited company.\n3. Brickwork Ratings is an Indian credit rating agency.\n\nWhich of the statements given above are correct?",
                options: ["1 and 2 only", "2 and 3 only", "1 and 3 only", "1, 2 and 3"],
                answer: 1
            },
            {
                question: "With reference to the ‘Banks Board Bureau (BBB)’, which of the following statements are correct?\n1. The Governor of RBI is the Chairman of BBB.\n2. BBB recommends for the selection of heads for Public Sector Banks.\n3. BBB helps the Public Sector Banks in developing strategies and capital raising plans.\n\nSelect the correct answer using the code given below:",
                options: ["1 and 2 only", "2 and 3 only", "1 and 3 only", "1, 2 and 3"],
                answer: 1
            },
            {
                question: "Consider the following statements:\n1) The Governor of the Reserve Bank of India (RBI) is appointed by the Central Government.\n2) Certain provisions in the Constitution of India give the Central Government the right to issue directions to the RBI in public interest.\n3) The Governor of the RBI draws his power from the RBI Act.\n\nWhich of the above statements are correct?",
                options: ["1 and 2 only", "2 and 3 only", "1 and 3 only", "1, 2 and 3"],
                answer: 3
            },
            {
                question: "With reference to urban cooperative banks in India consider the following statements:\n1) They are supervised and regulated by local boards set up by the state governments.\n2) They can issue equity shares and preference shares.\n3) They were brought under the purview of the Banking Regulation Act, 1949 through an Amendment in 1966.\n\nWhich of the statements given above is/are correct?",
                options: ["1 only", "2 and 3 only", "1 and 3 only", "1, 2 and 3"],
                answer: 1
            },
            {
                question: "In India, the central bank's function as the 'lender of last resort' usually refers to which of the following?\n1) Lending to trade and industry bodies when they fail to borrow from other sources\n2) Providing liquidity to the banks having a temporary crisis\n3) Lending to governments to finance budgetary deficits\n\nSelect the correct answer using the code given below.",
                options: ["1 and 2", "2 only", "2 and 3 only", "3 only"],
                answer: 1
            },
            {
                question: "In the context of the Indian economy, non-financial debt includes which of the following?\n1. Housing loans owed by households\n2. Amounts outstanding on credit cards\n3. Treasury bills\n\nSelect the correct answer using the code given below:",
                options: ["1 only", "1 and 2 only", "3 only", "1, 2 and 3"],
                answer: 3
            },
            {
                question: "With reference to the Indian economy, consider the following statements:\n1. A share of the household financial savings goes towards government borrowings.\n2. Dated securities issued at market-related rates in auctions form a large component of internal debt.\n\nWhich of the above statements is/are correct?",
                options: ["1 only", "2 only", "Both 1 and 2", "Neither 1 nor 2"],
                answer: 2
            },
            {
                question: "Along with the Budget, the Finance Minister also places other documents before the Parliament which include ‘The Macro Economic Framework Statement’. The aforesaid document is presented because this is mandated by:",
                options: ["Long standing parliamentary convention", "Article 112 and Article 110(1) of the Constitution of India", "Article 113 of the Constitution of India", "Provisions of the Fiscal Responsibility and Budget Management Act, 2003"],
                answer: 3
            }
        ];

        // Shuffle the questions array so they are jumbled
        for (let i = questions.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [questions[i], questions[j]] = [questions[j], questions[i]];
        }

        // ---------------------------------------------------------

        let currentQuestionIndex = 0;
        let score = 0;
        const questionText = document.getElementById("question-text");
        const optionsContainer = document.getElementById("options-container");
        const scoreDisplay = document.getElementById("score-display");
        const nextBtn = document.getElementById("next-btn");

        function loadQuestion() {
            if (currentQuestionIndex >= questions.length) {
                questionText.innerText = "Daily Goal Completed! 🎉";
                optionsContainer.innerHTML = `<p style='text-align:center; font-size: 1.2em;'>Your Final Score: ${score} / ${questions.length}</p>`;
                nextBtn.style.display = "none";
                scoreDisplay.style.display = "none";
                return;
            }

            const q = questions[currentQuestionIndex];
            
            questionText.innerText = (currentQuestionIndex + 1) + ". " + q.question;
            
            optionsContainer.innerHTML = "";
            nextBtn.disabled = true; 

            q.options.forEach((option, index) => {
                const button = document.createElement("button");
                button.innerText = option;
                button.classList.add("option-btn");
                button.onclick = () => checkAnswer(index, q.answer, button);
                optionsContainer.appendChild(button);
            });
            
            scoreDisplay.innerText = `Score: ${score} / ${questions.length}`;
        }

        function checkAnswer(selectedIndex, correctIndex, button) {
            const buttons = optionsContainer.getElementsByClassName("option-btn");
            
            for(let btn of buttons) {
                btn.disabled = true;
                btn.style.cursor = "default";
            }

            if (selectedIndex === correctIndex) {
                button.classList.add("correct");
                score++;
            } else {
                button.classList.add("wrong");
                buttons[correctIndex].classList.add("correct");
            }

            nextBtn.disabled = false;
        }

        function nextQuestion() {
            currentQuestionIndex++;
            loadQuestion();
        }

        document.getElementById("date-display").innerText = new Date().toDateString();
        loadQuestion();
    </script>
</body>
</html>
